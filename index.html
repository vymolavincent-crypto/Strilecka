<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Neon Nájezd">
<link rel="manifest" href="manifest.webmanifest">

<title>Neonový nájezd</title>
<style>
html,body{margin:0;height:100%;background:#07061a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;font-family:ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,"Courier New",monospace;color:#e8f0ff}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#c{position:fixed;left:0;top:0;display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;background:rgba(7,6,26,.88);text-align:center;padding:calc(16px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));z-index:3;overflow-y:auto;box-sizing:border-box}
.overlay.top{justify-content:flex-start}
.hidden{display:none!important}
p{margin:0;opacity:.85;max-width:340px;line-height:1.5;font-size:14px}
button{font:inherit;font-weight:800;font-size:18px;padding:12px 30px;border:3px solid #41e6ff;border-radius:0;background:#0d1a3a;color:#fff;box-shadow:0 5px 0 #000,inset 0 -4px 0 #2a8ad9;cursor:pointer;letter-spacing:1px;flex-shrink:0}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #000,inset 0 -4px 0 #2a8ad9}
button.sec{font-size:14px;padding:8px 18px;border-color:#5a6080;box-shadow:0 4px 0 #000,inset 0 -3px 0 #2a2e44;background:#141832}
button.gold{border-color:#ffe14d;box-shadow:0 5px 0 #000,inset 0 -4px 0 #d68a1a;background:#2a200a}
#hudBtns{position:fixed;top:calc(6px + env(safe-area-inset-top));right:6px;z-index:2;display:flex;gap:6px}
#hudBtns button{width:40px;height:40px;padding:0;font-size:15px;border-width:2px;border-color:#5a6080;background:rgba(13,16,48,.75);box-shadow:0 3px 0 #000}
#sa{position:fixed;top:0;height:env(safe-area-inset-top);width:1px;pointer-events:none;visibility:hidden}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:440px;flex-shrink:0}
.cards.one{grid-template-columns:1fr}
.card{all:unset;box-sizing:border-box;padding:8px 9px;border:3px solid #2a8ad9;background:#0d1030;box-shadow:0 4px 0 #000;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.3}
.card:active{transform:translateY(2px)}
.card b{font-size:14px;color:#41e6ff}
.card.off{opacity:.42}
.card.max{border-color:#1f9e5a}
.card.max b{color:#5dff8a}
.card.sel{border-color:#ffe14d;background:#1e1a0a}
.card.row{flex-direction:row;align-items:center;gap:12px}
.card .txt{display:flex;flex-direction:column;gap:3px;flex:1}
.pips{letter-spacing:1px;color:#ffe14d;font-size:11px}
.price{color:#ffe14d;font-weight:800;display:flex;align-items:center;gap:4px}
.crbar{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:800;color:#ffe14d}
.stats{font-size:15px;line-height:1.7}
.stats b{color:#ffe14d}
.hint{font-size:12px;opacity:.6;max-width:330px}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

</head>

<canvas id="c"></canvas>
<div id="sa"></div>
<div id="hudBtns" class="hidden"><button id="soundBtn" aria-label="Zvuk">♪</button><button id="pauseBtn" aria-label="Pauza">II</button></div>

<div id="menu" class="overlay">
  <div id="titleBox"></div>
  <div id="menuShip"></div>
  <p id="menuShipName" style="color:#ffe14d;font-weight:800"></p>

  <div class="row2"><button class="gold sec" id="hangarBtn">🚀 HANGÁR</button></div>
  <p id="bestMenu" style="opacity:.6"></p>

<div id="hangar" class="overlay top hidden">

  <button id="hangarBack">ZPĚT</button>
</div>

<div id="pause" class="overlay hidden">
  <div id="pauseTitle"></div>
  <button id="resumeBtn">▶ POKRAČOVAT</button>
  <button class="sec" id="quitBtn">Do menu</button>
</div>

<div id="shop" class="overlay top hidden">

  <div id="shopShip"></div>
  <div class="crbar"><span id="crIcon"></span><span id="shopCr">0</span></div>
  <div class="cards" id="cards"></div>
  <button id="leaveBtn">ODLETĚT ▶</button>

<div id="over" class="overlay hidden">

  <div class="stats" id="overStats"></div>
  <button id="againBtn">↻ ZNOVU</button>
  <button class="sec" id="menuBtn">Menu</button>

const SGW=29,SGH=21,SCX=14,SY0=5;
function buildShip(def,L){
  L=L||{};
  const g=[];for(let y=0;y<SGH;y++)g.push(new Array(SGW).fill('.'));
  const put=(x,y,ch)=>{if(ch!=='.'&&y>=0&&y<SGH&&x>=0&&x<SGW)g[y][x]=ch;};
  const part=(rows,dx,dy)=>rows.forEach((r,py)=>{for(let px=0;px<r.length;px++){const x=SCX+dx+px;put(x,SY0+dy+py,r[px]);put(2*SCX-x,SY0+dy+py,r[px]);}});
  const base=expand(def.rows,'m'),bw=base[0].length,x0=SCX-(bw>>1);
  // spodní vrstva
  for(let k=0;k<(L.gun||0);k++)part(["s","s","S","S"],-(5+k*2),3+k);
  if(L.msl>=1)part(["r","s","S"],-7,8);
  if(L.msl>=2)part(["r","s","S"],-9,9);
  if(L.msl>=3)part(["r","s","S"],-11,10);
  if(L.mag)part(["y.","s.",".s"],-4,-2);
  // loď
  base.forEach((r,py)=>{for(let px=0;px<r.length;px++)put(x0+px,SY0+py,r[px]);});
  // horní vrstva
  if(L.hull>=1)part(["sS","Ss"],-6,7);
  if(L.hull>=2)part(["Ss"],-3,10);
  if(L.hull>=3)part(["s","S"],-2,3);
  if(L.rate>=1)part(["y"],-1,6);
  if(L.rate>=3)part(["y"],-1,8);
  if(L.dmg>=1)part(["r"],0,-1);
  if(L.dmg>=3)part(["o"],0,-2);
  if(L.shd>=1)part(["c","C"],-5,2);
  if(L.plasma>=1)part(["p","P","p"],0,-4);
  if(L.plasma>=2)part(["P"],-1,-2);
  const sp=mk(g.map(r=>r.join('')),'n');
  sp.engY=SY0+1+base.length-sp.hh;sp.noseY=SY0+1-sp.hh;
  return sp;
}

}

function hitTest(e,x,y,pad){

  if(e.segs){const r=4+pad;for(const s of e.segs){const sx=x-s.x,sy=y-s.y;if(sx*sx+sy*sy<r*r)return true;}}
  return false;
}

function fireB(x,y,vx,vy,d,k,pierce){const b=take(bullets);if(!b)return;b.x=x;b.y=y;b.vx=vx;b.vy=vy;b.d=d;b.k=k||0;b.pierce=pierce||0;b.last=null;}
function playerFire(dt){
  const p=player,dm=dmgMul(),rm=rateMul(),ny=p.y+shipSpr.noseY;
  const w=ship.weapon;
  p.beamOn=false;
  if(w==='beam'){
    p.beamOn=true;
    const half=1+Math.min(2,lv.dmg>>1);
    let tg=null,ty=-10;
    for(const e of enemies){if(!e.on||e.y>p.y||e.y<-4)continue;if(Math.abs(e.x-p.x)<e.rx+half&&e.y>ty){ty=e.y;tg=e;}}
    p.beamY=tg?tg.y+e_ry(tg):-10;p.beamTg=tg;
    p.beamT-=dt;if(p.beamT<=0){p.beamT=0.05;if(tg){hitEnemy(tg,10*dm/rm*0.05);if(Math.random()<0.5)burst(p.x+rnd(-2,2),p.beamY,1,'violet',40,1);}}
  }else{
    p.fireT-=dt;
    if(p.fireT<=0){
      if(w==='std'){p.fireT=Math.max(p.fireT,-0.05)+0.13*rm;fireB(p.x,ny,0,-300,dm,0);}
      else if(w==='heavy'){p.fireT=Math.max(p.fireT,-0.05)+0.34*rm;fireB(p.x,ny,0,-250,3.2*dm,1,1);snd(160,0.06,'square',0.02,0.6);}
      else if(w==='spread'){p.fireT=Math.max(p.fireT,-0.05)+0.17*rm;for(const a of[-0.22,0,0.22])fireB(p.x,ny,Math.sin(a)*290,-Math.cos(a)*290,0.8*dm,0);}
      else if(w==='homing'){p.fireT=Math.max(p.fireT,-0.05)+0.16*rm;fireB(p.x,ny,rnd(-30,30),-240,1.05*dm,3);}
    }
  }
  // boční děla
  if(lv.gun){
    p.canT-=dt;
    if(p.canT<=0){p.canT=Math.max(p.canT,-0.05)+0.15*rm;
      const ang=[0,0.12,0.25];
      for(let k=0;k<lv.gun;k++){const ox=5+k*2,oy=p.y+SY0+4+k-shipSpr.hh;for(const s of[-1,1])fireB(p.x+s*ox,oy-1,Math.sin(s*ang[k])*290,-Math.cos(ang[k])*290,0.7*dm,0);}
    }
  }
  // drony
  p.dt^=1;
  if(lv.drone){p.drT=(p.drT||0)-dt;if(p.drT<=0){p.drT=0.22*rm;for(let i=0;i<lv.drone;i++){const d=p.drones[i];fireB(d.x,d.y-3,0,-280,0.8*dm,0);}}}
  // rakety
  if(lv.msl){p.mslT-=dt;if(p.mslT<=0){p.mslT=mslInt();for(const s of[-1,1]){const m=take(missiles);if(!m)break;m.x=p.x+s*8;m.y=p.y+4;m.vx=s*55;m.vy=-25;m.t=0;m.tg=null;}}}
  // plazma
  if(lv.plasma){p.plT-=dt;if(p.plT<=0){p.plT=plasmaInt();fireB(p.x,ny-3,0,-170,8*dm,2,99);snd(300,0.25,'sawtooth',0.05,0.4);}}
}
const e_ry=e=>e.ry*0.6;

/* ================= aktualizace ================= */
function update(dt){
  time+=dt;
  for(const s of stars){s.y+=s.v*dt;if(s.y>IH){s.y-=IH;s.x=Math.random()*IW;}}
  nebY=(nebY+dt*4)%IH;
  if(shake>0)shake=Math.max(0,shake-dt);
  if(bannerT>0)bannerT-=dt;
  for(const p of parts){if(!p.on)continue;p.life-=dt;if(p.life<=0){p.on=false;continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.95;p.vy*=0.95;}
  updateAmb(dt);
  if(state==='dying'){deadT-=dt;if(deadT<=0)showGameOver();}
  if(state==='dock'||state==='undock')updateDock(dt);
  if(state!=='play'&&state!=='dying'&&state!=='dock'&&state!=='undock')return;
  const alive=state==='play';
  const p=player;

  if(alive){
    const kv=170*dt;
    if(keys.ArrowLeft||keys.a)p.tx-=kv;if(keys.ArrowRight||keys.d)p.tx+=kv;
    if(keys.ArrowUp||keys.w)p.ty-=kv;if(keys.ArrowDown||keys.s)p.ty+=kv;
    clampT();
    const k=Math.min(1,dt*26);p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k;
    if(p.inv>0)p.inv-=dt;
    if(comboT>0){comboT-=dt;if(comboT<=0)chain=0;}
    if(lv.shd&&!p.shield){p.shdT-=dt;if(p.shdT<=0){p.shield=true;snd(600,0.15,'triangle',0.04,1.3);}}
    if(phase!=='station')playerFire(dt);else p.beamOn=false;
    if(phase==='wave'){
      if(toSpawn>0){
        spawnT-=dt;
        if(spawnT<=0){
          const t=pickType();
          if(biomeIdx===0&&wave>=3&&toSpawn>=5&&Math.random()<0.13){spawnFormation();toSpawn-=5;}
          else if(t==='bug'){spawnSwarm(4+Math.min(3,loopN+(wib()>2?1:0)),rnd(30,GW-30),-8);toSpawn--;}
          else{spawnEnemy(t);toSpawn--;}
          spawnT=Math.max(0.28,1.0-wave*0.04)*rnd(0.6,1.25);
        }
      }else if(!boss){
        let any=false;for(const e of enemies)if(e.on){any=true;break;}
        if(!any){waveDelay-=dt;if(waveDelay<=0){waveDelay=1.4;if(wave>0&&(wib()===3||wib()===5))spawnStation();else nextWave();}}
      }
    }
  }else p.beamOn=false;
  for(let i=0;i<lv.drone;i++){const d=p.drones[i],s=i?1:-1,kk=Math.min(1,dt*10);d.x+=(p.x+s*16-d.x)*kk;d.y+=(p.y+6-d.y)*kk;}
  // stanice
  if(station){
    const s=station;s.t+=dt;
    if(s.leaving){s.y-=70*dt;if(s.y<-40)station=null;}
    else{
      const ty=IH*0.32;if(s.y<ty)s.y=Math.min(ty,s.y+60*dt);
      if(state!=='dock'&&state!=='undock')s.x=GW/2+Math.sin(s.t*0.8)*10;
      if(alive&&s.y>=ty-1){const D=dockPos(),dx=D.x-p.x,dy=D.y-p.y;if(dx*dx+dy*dy<20*20)startDock();}
    }
  }
  if(!player)return;
  const ebs=62+Math.min(wave,30)*2.2+loopN*10;
  // nepřátelé
  for(const e of enemies){
    if(!e.on)continue;
    e.t+=dt;if(e.flash>0)e.flash-=dt;
    const d=e.d;
    switch(d.beh){
      case 'sine':e.y+=e.vy*dt;e.x=e.bx+Math.sin(e.t*2.2+e.ph)*e.amp;
        if(alive&&wave>=2&&d.shoot){e.fire-=dt;if(e.fire<=0&&e.y>4){if(d.shoot==='aim')aimed(e,1,0,ebs*0.9);else shootE(e.x,e.y+4,0,ebs);e.fire=rnd(2.5,5);}}break;
      case 'dash':
        if(e.st===0){if(e.key==='bat')e.x=e.bx+Math.sin(e.t*5)*10;if(e.t>0.9&&alive){e.st=1;const dx=p.x-e.x,dy=p.y-e.y,dd=Math.hypot(dx,dy)||1,v=135+wave*2.5;e.vx=dx/dd*v;e.vy=dy/dd*v;snd(500,0.12,'square',0.03,0.5);}}
        e.x+=e.vx*dt;e.y+=e.vy*dt;break;
      case 'tank':e.y+=e.vy*dt;
        if(alive){e.fire-=dt;if(e.fire<=0&&e.y>4){aimed(e,wave>=8?3:1,0.25,ebs);e.fire=rnd(1.4,2.2);}}break;
      case 'split':e.y+=e.vy*dt;e.x=e.bx+Math.sin(e.t*1.3+e.ph)*e.amp;break;
      case 'mini':e.x+=e.vx*dt;e.y+=e.vy*dt;e.vx*=0.985;break;
      case 'larva':{if(e.st===0&&alive){const dx=p.x-e.x,dy=p.y-e.y,dd=Math.hypot(dx,dy)||1;e.vx=dx/dd*55;e.vy=Math.max(20,dy/dd*55);e.st=1;}e.x+=e.vx*dt;e.y+=e.vy*dt;break;}
      case 'sniper':
        if(e.st===0){e.y+=e.vy*dt;if(e.y>=e.ty){e.st=1;e.fire=0.6;}}
        else if(e.st===1){
          if(alive){
            if(e.aim>0){e.aim-=dt;if(e.aim<=0){const dx=e.ax-e.x,dy=e.ay-e.y,dd=Math.hypot(dx,dy)||1,v=ebs*2.6;shootE(e.x,e.y+5,dx/dd*v,dy/dd*v,2);e.cnt++;e.fire=1.6;snd(900,0.1,'square',0.03,0.3);if(e.cnt>=3){e.st=2;e.vy=28;}}}
            else{e.fire-=dt;if(e.fire<=0){e.aim=0.75;e.ax=p.x;e.ay=p.y;}}
          }
        }else e.y+=e.vy*dt;
        break;
      case 'spinner':
        if(e.st===0){e.y+=e.vy*dt;if(e.y>=e.ty){e.st=1;e.cnt=3.6;}}
        else if(e.st===1){e.cnt-=dt;e.ang+=dt*2.6;
          if(alive){e.fire-=dt;if(e.fire<=0){e.fire=0.13;for(let i=0;i<2;i++){const a=e.ang+i*Math.PI;shootE(e.x,e.y,Math.cos(a)*ebs*0.8,Math.sin(a)*ebs*0.8);}}}
          if(e.cnt<=0){e.st=2;e.vy=32;}}
        else e.y+=e.vy*dt;
        break;
      case 'carrier':e.y+=e.vy*dt;
        if(alive){e.fire-=dt;if(e.fire<=0&&e.y>0){e.fire=2.8;for(const s of[-1,1]){const c=spawnEnemy(d.child,e.x+s*9,e.y+4);if(c){c.amp=8;c.vy=34;}}if(wave>=12)ringShot(e.x,e.y,8,e.t,ebs*0.7);}}
        break;
      case 'rock':e.x+=e.vx*dt;e.y+=e.vy*dt;break;
      case 'comet':e.x+=e.vx*dt;e.y+=e.vy*dt;
        if(Math.random()<0.8){const pp=take(parts);if(pp){pp.x=e.x;pp.y=e.y;pp.vx=-e.vx*0.2;pp.vy=-e.vy*0.2;pp.life=pp.max=0.35;pp.ramp=RAMP.ice;pp.sz=1;}}break;
      case 'jelly':e.y+=e.vy*dt;e.x=e.bx+Math.sin(e.t*0.8+e.ph)*e.amp;
        if(alive){e.fire-=dt;if(e.fire<=0&&e.y>4){ringShot(e.x,e.y,8,e.t,ebs*0.55,0);e.fire=2.6;}}break;
      case 'turret':
        if(e.st===0){e.y+=e.vy*dt;if(e.y>=e.ty)e.st=1;}
        else if(e.st===1){if(alive){e.fire-=dt;if(e.fire<=0){aimed(e,3,0.15,ebs*1.1);e.cnt++;e.fire=1.7;if(e.cnt>=4){e.st=2;e.vy=26;}}}}
        else e.y+=e.vy*dt;
        break;
      case 'bomber':e.x+=e.vx*dt;e.y+=e.vy*dt;
        if(e.y>=e.ty){e.cnt+=dt;e.flash=Math.floor(e.cnt*10)%2?0.05:0;if(e.cnt>0.7){killEnemy(e,true);continue;}}break;
      case 'worm':{
        e.y+=e.vy*dt;e.x=e.bx+Math.sin(e.t*1.6+e.ph)*Math.min(e.amp,GW/2-10);
        const tr=e.trail,l=tr[tr.length-1];
        if(!l||Math.abs(l.x-e.x)+Math.abs(l.y-e.y)>=2){tr.push({x:e.x,y:e.y});if(tr.length>40)tr.shift();}
        for(let i=0;i<e.segs.length;i++){const idx=tr.length-1-(i+1)*3;const src=idx>=0?tr[idx]:null;if(src){e.segs[i].x=src.x;e.segs[i].y=src.y;}else{e.segs[i].x=e.x;e.segs[i].y=e.y-6*(i+1);}}
        if(alive){e.fire-=dt;if(e.fire<=0&&e.y>4){const s=e.segs[e.segs.length-1];shootE(s.x,s.y,rnd(-20,20),ebs*0.8);e.fire=rnd(0.8,1.4);}}
        break;}
      case 'swarm':e.y+=e.vy*dt;if(alive)e.x+=Math.max(-28,Math.min(28,(p.x-e.x)*0.6))*dt;e.x+=Math.sin(e.t*6+e.ph)*24*dt;break;
      case 'egg':e.y+=e.vy*dt;e.cnt-=dt;
        if(e.cnt<0.8)e.flash=Math.floor(e.cnt*10)%2?0.05:0;
        if(e.cnt<=0){burst(e.x,e.y,14,'hive',50,1);for(let i=0;i<3;i++){const l=spawnEnemy('larva',e.x+(i-1)*5,e.y);}e.on=false;snd(200,0.15,'square',0.04,0.5);continue;}
        break;
      case 'boss':updateBoss(e,dt,alive,ebs);break;
    }
    if(alive){
      if(hitTest(e,p.x,p.y,2)){hurtPlayer();if(d.beh!=='boss')hitEnemy(e,d.beh==='rock'?5:3);}
    }
    if(e.on&&d.beh!=='boss'&&(e.y>IH+24||e.x<-34||e.x>GW+34||(e.y<-60&&e.t>3))){if(!(d.beh==='worm'&&e.segs[e.segs.length-1].y<IH+8))e.on=false;}
  }
  // lasery
  for(const l of lasers){
    if(!l.on)continue;l.t+=dt;
    if(l.t>l.warn+l.act){l.on=false;continue;}
    if(alive&&l.t>l.warn&&Math.abs(p.x-l.x)<4&&p.y>l.y0)hurtPlayer();
  }
  // střely hráče
  for(const b of bullets){
    if(!b.on)continue;
    if(b.k===3){let tg=null,bd=1e9;for(const e of enemies){if(!e.on||e.y<0||e.y>b.y)continue;const dd=(e.x-b.x)**2+(e.y-b.y)**2;if(dd<bd){bd=dd;tg=e;}}
      if(tg){let a=Math.atan2(b.vy,b.vx);const ta=Math.atan2(tg.y-b.y,tg.x-b.x);let da=ta-a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;a+=Math.max(-6*dt,Math.min(6*dt,da));b.vx=Math.cos(a)*250;b.vy=Math.sin(a)*250;}}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-8||b.x<-8||b.x>GW+8||b.y>IH+8){b.on=false;continue;}
    if(b.k===2&&Math.random()<0.6){const pp=take(parts);if(pp){pp.x=b.x+rnd(-2,2);pp.y=b.y+3;pp.vx=0;pp.vy=20;pp.life=pp.max=0.3;pp.ramp=RAMP.pink;pp.sz=1;}}
    for(const e of enemies){
      if(!e.on||e.y<-4||e===b.last)continue;
      if(hitTest(e,b.x,b.y,1)){
        if(Math.random()<0.35)burst(b.x,b.y,1,'cyan',40,1);
        b.last=e;hitEnemy(e,b.d);
        if(b.pierce>0){b.pierce--;}else{b.on=false;}
        break;
      }
    }
  }
  // rakety
  for(const m of missiles){
    if(!m.on)continue;m.t+=dt;
    if(!m.tg||!m.tg.on){let bd=1e9;m.tg=null;for(const e of enemies){if(!e.on||e.y<0)continue;const dd=(e.x-m.x)**2+(e.y-m.y)**2;if(dd<bd){bd=dd;m.tg=e;}}}
    let ang=Math.atan2(m.vy,m.vx);
    if(m.tg){const ta=Math.atan2(m.tg.y-m.y,m.tg.x-m.x);let da=ta-ang;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;ang+=Math.max(-7*dt,Math.min(7*dt,da));}
    const sp=Math.min(190,Math.hypot(m.vx,m.vy)+260*dt);m.vx=Math.cos(ang)*sp;m.vy=Math.sin(ang)*sp;
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    if(Math.random()<0.7){const pp=take(parts);if(pp){pp.x=m.x;pp.y=m.y;pp.vx=rnd(-8,8);pp.vy=rnd(-8,8);pp.life=pp.max=0.25;pp.ramp=RAMP.fire;pp.sz=1;}}
    if(m.t>3||m.y<-10||m.y>IH+10||m.x<-10||m.x>GW+10){m.on=false;continue;}
    for(const e of enemies){if(!e.on)continue;if(hitTest(e,m.x,m.y,2)){m.on=false;burst(m.x,m.y,8,'fire',50,1);hitEnemy(e,4*dmgMul());break;}}
  }
  // střely nepřátel
  for(const b of ebul){
    if(!b.on)continue;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y>IH+6||b.y<-10||b.x<-6||b.x>GW+6){b.on=false;continue;}
    if(alive){const dx=b.x-p.x,dy=b.y-p.y,rr=b.k===1?4.5:3.2;if(dx*dx+dy*dy<rr*rr){b.on=false;hurtPlayer();}}
  }
  // předměty
  const mr=magR();
  for(const it of items){
    if(!it.on)continue;it.t+=dt;
    const dx=p.x-it.x,dy=p.y-it.y,dd=Math.hypot(dx,dy)||1;
    if(alive&&(it.suck||dd<mr))it.suck=true;
    if(it.suck&&alive){const v=Math.min(260,120+it.t*60);it.x+=dx/dd*v*dt;it.y+=dy/dd*v*dt;}
    else{it.vx*=0.94;it.vy+=(30-it.vy)*dt*2;it.x+=it.vx*dt;it.y+=it.vy*dt;}
    if(it.y>IH+8||(it.k===0&&it.t>12&&!it.suck)){it.on=false;continue;}
    if(alive&&dd<7){
      it.on=false;
      if(it.k===0){crystals++;crTotal++;score+=2;if(Math.random()<0.5)snd(1200+Math.random()*300,0.05,'square',0.02);}
      else if(it.k===1){if(p.hp<p.maxHp){p.hp++;banner('+1 ŽIVOT','',1.2);}else{score+=300;banner('+300','',1);}burst(it.x,it.y,12,'pink',50,1);snd(660,0.18,'triangle',0.06,1.8);vib(20);}
      else{p.shield=true;banner('ŠTÍT!','',1.2);burst(it.x,it.y,12,'cyan',50,1);snd(700,0.18,'triangle',0.06,1.6);vib(20);}
    }
  }
}
function updateBoss(e,dt,alive,ebs){
  const sp=e.d.fr[0],p=player;
  if(e.y<e.ty)e.y+=e.vy*dt;
  const spd=e.d.pat==='ice'?0.4:0.6;
  e.x=GW/2+Math.sin(e.t*spd)*(GW/2-sp.hw-4);
  if(!alive||e.y<e.ty-4)return;
  e.fire-=dt;
  const pat=e.d.pat;
  if(pat==='guard'){
    if(e.fire<=0){e.st=(e.st+1)%4;
      if(e.st===0||e.st===2)ringShot(e.x,e.y,14+Math.floor(wave/5)*2,e.t,ebs*0.75,1);
      else if(e.st===1)aimed(e,5,0.18,ebs*1.05);else aimed(e,3,0.12,ebs*1.3,1);
      e.fire=Math.max(0.55,1.05-wave*0.015);}
  }else if(pat==='ice'){
    if(e.fire<=0){e.st=(e.st+1)%3;
      if(e.st===0){addLaser(p.x,e.y+6);addLaser(rnd(10,GW-10),e.y+6);if(wave>=20)addLaser(rnd(10,GW-10),e.y+6);snd(200,0.5,'sawtooth',0.04,2);}
      else if(e.st===1)ringShot(e.x,e.y,12,e.t,ebs*0.6,1);
      else{for(const s of[-1,1]){const m=spawnEnemy('shardMini',e.x+s*12,e.y+6);if(m){m.vx=s*30;m.vy=50;}}aimed(e,5,0.15,ebs);}
      e.fire=Math.max(0.8,1.4-wave*0.015);}
  }else if(pat==='lava'){
    e.ang+=dt*(2.2+Math.sin(e.t*0.5)*1.2);e.cnt-=dt;
    if(e.cnt<=0){e.cnt=Math.max(0.07,0.11-wave*0.001);for(let i=0;i<3;i++){const a=e.ang+i*TAU/3;shootE(e.x,e.y,Math.cos(a)*ebs*0.7,Math.sin(a)*ebs*0.7);}}
    if(e.fire<=0){e.st=(e.st+1)%3;
      if(e.st===2){for(let i=0;i<10;i++)shootE(rnd(6,GW-6),ST+4-i*14,0,ebs*0.9,1);snd(150,0.4,'sawtooth',0.04,0.5);}
      else aimed(e,5,0.16,ebs*1.15,1);
      e.fire=2;}
  }else{ // úl
    if(e.fire<=0){e.st=(e.st+1)%3;
      if(e.st===0){spawnSwarm(4,e.x,e.y+10);snd(240,0.3,'square',0.04,0.6);}
      else if(e.st===1)aimed(e,5,0.17,ebs*1.1);
      else ringShot(e.x,e.y,14,e.t,ebs*0.7,1);
      e.fire=Math.max(0.7,1.3-wave*0.012);}
  }
}
function updateAmb(dt){
  const a=biome.amb;if(!a)return;
  if(Math.random()<dt*25){const o=take(amb);if(o){o.t=0;
    if(a==='snow'){o.x=rnd(0,IW);o.y=-2;o.vx=rnd(-6,6);o.vy=rnd(18,40);}
    else if(a==='ember'){o.x=rnd(0,IW);o.y=IH+2;o.vx=rnd(-8,8);o.vy=-rnd(18,40);}
    else{o.x=rnd(0,IW);o.y=-2;o.vx=rnd(-4,4);o.vy=rnd(6,14);}}}
  for(const o of amb){if(!o.on)continue;o.t+=dt;o.x+=(o.vx+Math.sin(o.t*2+o.y)*6)*dt;o.y+=o.vy*dt;if(o.y<-4||o.y>IH+4)o.on=false;}
}

/* ================= vykreslení ================= */
function ds(sp,x,y,flash){ctx.drawImage(flash?sp.f:sp.c,Math.round(x)-sp.hw,Math.round(y)-sp.hh);}
function eFrame(e){const fr=e.d.fr;return fr.length>1&&Math.floor(e.t*5+e.ph)%2?fr[1]:fr[0];}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  if(nebula){const y=Math.round(nebY);ctx.drawImage(nebula,0,y-IH);ctx.drawImage(nebula,0,y);}
  else{ctx.fillStyle=biome.bg;ctx.fillRect(0,0,IW,IH);}
  for(let l=0;l<3;l++){ctx.fillStyle=biome.stars[l];for(const s of stars)if(s.l===l)ctx.fillRect(s.x|0,s.y|0,1,l===2?2:1);}
  if(biome.amb){const col=biome.amb==='snow'?'#e4f8ff':biome.amb==='ember'?'#ff8a2a':'#c6f04a';ctx.fillStyle=col;for(const o of amb)if(o.on)ctx.fillRect(o.x|0,o.y|0,1,1);
    if(biome.amb==='ember'){ctx.fillStyle='#ffe14d';for(const o of amb)if(o.on&&Math.floor(o.t*6+o.x)%3===0)ctx.fillRect(o.x|0,o.y|0,1,1);}}
  let sx=0,sy=0;if(shake>0){const m=Math.ceil(shake*4);sx=ri(-m,m);sy=ri(-m,m);}
  if(OX>0){ctx.fillStyle='#030210';ctx.fillRect(0,0,OX,IH);ctx.fillRect(OX+GW,0,IW-OX-GW,IH);ctx.fillStyle='#1a1a40';ctx.fillRect(OX-1,0,1,IH);ctx.fillRect(OX+GW,0,1,IH);}
  ctx.setTransform(1,0,0,1,OX+sx,sy);

  if(station)drawStation(false);
  for(const it of items){if(!it.on)continue;if(it.k===0){if(it.t>9&&!it.suck&&Math.floor(it.t*8)%2)continue;ds(Math.floor(time*6+it.x)%5===0?SP.crystal2:SP.crystal,it.x,it.y);}else ds(it.k===1?SP.heart:SP.shieldPU,it.x,it.y);}
  for(const e of enemies){
    if(!e.on)continue;
    if(e.segs){const sg=SP.wormSeg;for(let i=e.segs.length-1;i>=0;i--)ds(sg,e.segs[i].x,e.segs[i].y,e.flash>0);}
    ds(eFrame(e),e.x,e.y,e.flash>0);
    if(e.d.beh==='sniper'&&e.aim>0&&Math.floor(e.aim*14)%2===0){
      const dx=e.ax-e.x,dy=e.ay-e.y,L=Math.hypot(dx,dy)||1;ctx.fillStyle='#ff3b4e';
      for(let i=6;i<L+40;i+=3)ctx.fillRect(Math.round(e.x+dx/L*i),Math.round(e.y+dy/L*i),1,1);
    }
  }
  for(const l of lasers){
    if(!l.on)continue;const x=Math.round(l.x);
    const c1=biomeIdx===1?['#3a7fc0','#8fd3ff']:['#9b2a9e','#ff4fd8'];
    if(l.t<l.warn){if(Math.floor(l.t*12)%2===0){ctx.fillStyle=c1[1];for(let y=Math.round(l.y0);y<IH;y+=4)ctx.fillRect(x,y,1,2);}}
    else{ctx.fillStyle=c1[0];ctx.fillRect(x-3,l.y0,7,IH);ctx.fillStyle=c1[1];ctx.fillRect(x-2,l.y0,5,IH);ctx.fillStyle='#fff';ctx.fillRect(x-1,l.y0,3,IH);}
  }
  const pbs=lv.dmg>=2?SP.pb2:SP.pb;
  for(const b of bullets)if(b.on)ds(b.k===1?SP.pbBig:b.k===2?SP.pbP:b.k===3?SP.pbH:pbs,b.x,b.y);
  ctx.fillStyle='#ffe14d';for(const m of missiles)if(m.on)ctx.fillRect(Math.round(m.x)-1,Math.round(m.y)-1,2,2);

  if(player&&shipSpr&&state!=='dying'&&state!=='menu'&&state!=='over'&&state!=='hangar'){
    const p=player;
    if(p.beamOn&&!(state!=='play')){
      const x=Math.round(p.x),y0=Math.round(p.y+shipSpr.noseY),y1=Math.max(0,Math.round(p.beamY)),hw=1+Math.min(2,lv.dmg>>1);
      if(y0>y1){ctx.fillStyle='#5a3aa8';ctx.fillRect(x-hw-1,y1,hw*2+3,y0-y1);ctx.fillStyle='#b07bff';ctx.fillRect(x-hw,y1,hw*2+1,y0-y1);ctx.fillStyle=Math.floor(time*20)%2?'#fff':'#ffe14d';ctx.fillRect(x,y1,1,y0-y1);}
    }
    const blink=p.inv>0&&state==='play'&&Math.floor(p.inv*14)%2===0;
    if(!blink){
      const fx=Math.round(p.x),fy=Math.round(p.y+shipSpr.engY),R=RAMP.fire,big=state==='undock'||state==='dock';
      const eo=ship.eng;
      for(const ox of eo?[-eo,eo]:[0]){const n=ri(1,big?4:3)+(lv.rate>=3?1:0);for(let i=0;i<n;i++){ctx.fillStyle=R[Math.min(4,i+ri(0,1))];ctx.fillRect(fx+ox,fy+i,1,1);}}
      ds(shipSpr,p.x,p.y);
      for(let i=0;i<lv.drone;i++){const d=p.drones[i];ds(SP.wing,d.x,d.y);ctx.fillStyle=R[ri(1,2)];ctx.fillRect(Math.round(d.x),Math.round(d.y)+3,1,ri(1,2));}
    }
    if(p.shield&&Math.floor(time*10)%4!==0)ds(SP.shield,p.x,p.y);
  }
  if(station&&(state==='dock'||state==='undock'||state==='shop'))drawStation(true);
  const E=EB[biome.eb];
  for(const b of ebul){if(!b.on)continue;ds(b.k===1?E.b:b.k===2?E.n:E.s,b.x,b.y);}
  for(const pt of parts){if(!pt.on)continue;const R=pt.ramp,i=Math.min(R.length-1,Math.floor((1-pt.life/pt.max)*R.length));ctx.fillStyle=R[i];ctx.fillRect(Math.round(pt.x),Math.round(pt.y),pt.sz,pt.sz);}

  // HUD
  ctx.setTransform(1,0,0,1,OX,0);
  if(player&&(state==='play'||state==='pause'||state==='dying'||state==='shop'||state==='dock'||state==='undock')){
    const p=player,y0=ST+4;
    drawText(ctx,score,4,y0,1,'#fff','l');
    ds(SP.crystal,6,y0+10);drawText(ctx,crystals,10,y0+8,1,'#ffe14d','l');
    drawText(ctx,'VLNA '+wave,4,y0+16,1,'#8890c0','l');
    const hw=p.maxHp*6,hx=Math.round(GW/2-hw/2);
    for(let i=0;i<p.maxHp;i++)ds(i<p.hp?SP.hh:SP.hhE,hx+i*6+3,y0+3);
    if(p.shield)ds(SP.hhS,hx+hw+4,y0+3);
    const mult=Math.min(5,1+Math.floor(chain/8));
    if(mult>1)drawText(ctx,'×'+mult,GW/2,y0+9,1,'#ffe14d','c');
    if(boss&&boss.on){
      const bw=Math.min(GW-100,100),bx=Math.round((GW-bw)/2),by=y0+17;
      ctx.fillStyle=OUT;ctx.fillRect(bx-1,by-1,bw+2,5);ctx.fillStyle='#3a1a2e';ctx.fillRect(bx,by,bw,3);
      ctx.fillStyle='#ff3b4e';ctx.fillRect(bx,by,Math.round(bw*Math.max(0,boss.hp/boss.max)),3);
      ctx.fillStyle='#ffb0b8';ctx.fillRect(bx,by,Math.round(bw*Math.max(0,boss.hp/boss.max)),1);
    }
    if(state==='dock'&&dockT>1.3){if(Math.floor(time*4)%2===0)drawText(ctx,'PŘIPOJENO',GW/2,Math.round(station.y)-SP.station.hh-12,1,'#5dff8a','c');}
    if(bannerT>0&&!(bannerT<0.6&&Math.floor(bannerT*10)%2)){
      const by=Math.round(IH*0.45);
      const sc=textW(bannerText)*2>GW-8?1:2;
      drawText(ctx,bannerText,GW/2,by,sc,'#fff','c');
      if(bannerSub)drawText(ctx,bannerSub,GW/2,by+16,1,'#ffe14d','c');
    }
  }
}
function drawStation(front){
  const s=station,sp=SP.station,x=Math.round(s.x),y=Math.round(s.y);
  if(!front){
    ds(sp,s.x,s.y);
    const blink=Math.floor(time*3)%2===0;
    ctx.fillStyle=blink?'#5dff8a':'#1f9e5a';ctx.fillRect(x-1,y-2,3,3);
    ctx.fillStyle=Math.floor(time*2)%2?'#ff3b4e':'#5a1008';ctx.fillRect(x-12,y-5,1,1);ctx.fillRect(x+12,y-5,1,1);
    if(!s.leaving&&state==='play'&&Math.floor(time*2)%2===0){const D=dockPos();ctx.fillStyle='#5dff8a';ctx.fillRect(Math.round(D.x)-6,Math.round(D.y)+10,3,1);ctx.fillRect(Math.round(D.x)+4,Math.round(D.y)+10,3,1);ctx.fillRect(Math.round(D.x)-1,Math.round(D.y)+13,3,1);}
  }else{
    const D=dockPos(),dx=Math.round(D.x),dy=Math.round(D.y),c=s.clamp,off=Math.round(11-c*5);
    ctx.fillStyle='#05040f';ctx.fillRect(dx-off-4,dy-4,5,5);ctx.fillRect(dx+off,dy-4,5,5);
    ctx.fillStyle='#5a6080';ctx.fillRect(dx-off-3,dy-3,3,3);ctx.fillRect(dx+off+1,dy-3,3,3);
    ctx.fillStyle='#a0a8c8';ctx.fillRect(dx-off-3,dy-3,3,1);ctx.fillRect(dx+off+1,dy-3,3,1);
    ctx.fillStyle=c>=1?'#5dff8a':'#ffe14d';ctx.fillRect(dx-off-1,dy-1,1,1);ctx.fillRect(dx+off+1,dy-1,1,1);
    if(state==='dock'&&dockT>1.35){const sy=dy-8+Math.round(((dockT-1.35)*20)%16);ctx.fillStyle='#5dff8a';ctx.fillRect(dx-7,sy,15,1);}
  }
}

/* ================= smyčka ================= */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;
  if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
let rT=0;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(resize,120);});
resize();setState('menu');requestAnimationFrame(loop);

if(location.hash==='#debug')window.__dbg={spawnEnemy,spawnBoss,spawnStation,nextWave,setWave:w=>{wave=w;},setBiome,lv:()=>lv,state:()=>state,give:n=>{crystals+=n;},bank:n=>{bank+=n;},god:()=>{player.hp=99;player.maxHp=99;},clear:()=>{toSpawn=0;},st:()=>station&&[station.x,station.y],pl:()=>[player.x,player.y,player.hp],dock:()=>{if(station){const D=dockPos();player.x=player.tx=D.x;player.y=player.ty=D.y+6;}},setShip:id=>{shipId=id;},upg:o=>{Object.assign(lv,o);shipSpr=buildShip(ship,lv);}};
/* ================= offline režim (funguje, když je hra nahraná na webu) ================= */
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&window.self===window.top){navigator.serviceWorker.register('sw.js').catch(()=>{});}}catch(e){}
})();
</script>
