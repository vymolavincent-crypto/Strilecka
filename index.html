<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff4e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Herna">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Herna</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded",system-ui,-apple-system,sans-serif;color:#3a3350;
  background:linear-gradient(180deg,#fff4e8 0%,#fdeaf3 45%,#e9f1ff 100%) fixed;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:540px;margin:0 auto}
header{text-align:center;padding:10px 0 4px}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo img{width:52px;height:52px;border-radius:14px;box-shadow:0 6px 14px -6px rgba(255,120,80,.6)}
h1{margin:0;font-size:40px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#ff7a59,#ff4f9a 50%,#7c6cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#8a819f;font-size:15px;margin:4px 0 14px}
.status{display:flex;align-items:center;gap:10px;margin:0 auto 18px;padding:10px 14px;border-radius:16px;background:#fff;font-size:14px;box-shadow:0 4px 16px -8px rgba(80,60,120,.35);color:#b07a10}
.status.ok{color:#1f9d55}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
h2{font-size:17px;margin:20px 4px 10px;color:#5b5275;display:flex;align-items:center;gap:8px}
h2 span{font-size:12px;font-weight:600;background:#fff;border-radius:20px;padding:3px 9px;color:#8a819f}
.game{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:12px;border-radius:22px;background:#fff;text-decoration:none;color:inherit;
  box-shadow:0 8px 22px -12px rgba(80,60,120,.45);border-left:6px solid var(--c);transition:transform .12s}
.game:active{transform:scale(.97)}
.game img{width:70px;height:70px;border-radius:18px;flex:none;image-rendering:pixelated;background:#f4f1fb}
.game .info{flex:1;min-width:0}
.game .t{font-size:18px;font-weight:800;color:#2f2843;margin-bottom:3px}
.game .d{font-size:13px;color:#7d7594;line-height:1.35}
.game .r{font-size:12.5px;color:#5b5275;margin-top:6px;font-weight:600}
.game .r:empty{display:none}
.game .play{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-size:18px;box-shadow:0 6px 12px -6px var(--c)}
.soon{padding:16px;border-radius:22px;border:2px dashed #d9cfe8;color:#a49bb8;text-align:center;font-size:14px;line-height:1.5;margin-top:4px}
button{font:inherit;cursor:pointer}
.link{display:block;margin:20px auto 0;padding:11px 18px;border:0;border-radius:14px;background:#fff;color:#ff4f9a;font-size:15px;font-weight:800;box-shadow:0 6px 16px -10px rgba(80,60,120,.5)}
.link.hidden{display:none}
.save{margin-top:12px;text-align:center;font-size:13px;color:#8a819f;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(60,45,90,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal.hidden{display:none}
.box{max-width:400px;width:100%;background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 40px -16px rgba(60,40,100,.5)}
.box h3{margin:0 0 12px;font-size:21px;text-align:center;color:#2f2843}
.box ol{margin:0;padding-left:22px;line-height:1.8;font-size:15px}
.box .note{margin-top:12px;font-size:13.5px;color:#7d7594;line-height:1.5}
.box button{margin-top:16px;width:100%;padding:13px;border-radius:14px;border:0;background:#7c6cff;color:#fff;font-weight:800;font-size:16px}
.ic{display:inline-block;padding:0 7px;border-radius:8px;background:#f1ecfb;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><img src="icon-192.png" alt=""><h1>Herna</h1></div>
    <div class="sub">Naše hry · fungují i bez internetu</div>
  </header>
  <div class="status" id="status"><span class="dot"></span><span id="statusT">Kontroluju offline režim…</span></div>
  <div id="list"></div>
  <div class="soon">🎁 Další hry spolu brzy přidáme!</div>
  <button class="link" id="installBtn">📲 Jak dát Hernu na plochu telefonu</button>
  <div class="save">💾 Ve hrách s delším postupem se tvůj postup ukládá sám.</div>
</div>

<div class="modal hidden" id="help">
  <div class="box">
    <h3 id="helpTitle">Jak Hernu stáhnout</h3>
    <div id="helpBody"></div>
    <button id="helpClose">Rozumím</button>
  </div>
</div>

<script src="hry.js"></script>
<script>
const $ = id => document.getElementById(id);
const HRY = self.HERNA_HRY || [];

// --- seznam her ---
const karta = h => `
  <a class="game" style="--c:${h.barva}" href="${h.soubory[1]}">
    <img src="${h.ikona}" alt="">
    <div class="info"><div class="t">${h.nazev}</div><div class="d">${h.popis}</div><div class="r" data-r="${h.id}"></div></div>
    <div class="play">▶</div>
  </a>`;
$('list').innerHTML =
  '<h2>👥 Pro 2 hráče <span>na jednom telefonu</span></h2>' + HRY.filter(h => h.hraci === 2).map(karta).join('') +
  '<h2>🎮 Pro 1 hráče</h2>' + HRY.filter(h => h.hraci !== 2).map(karta).join('');
function stavy(){ for (const h of HRY) { const el = document.querySelector('[data-r="' + h.id + '"]'); try { el.textContent = h.stav ? h.stav() : ''; } catch (e) {} } }
stavy();
addEventListener('pageshow', stavy);

// --- ať telefon uložený postup nemaže ---
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

// --- offline stav ---
const nainstalovano = navigator.standalone === true || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
function status(ok, text){ $('status').className = 'status' + (ok ? ' ok' : ''); $('statusT').textContent = text; }
async function zkontroluj(){
  try {
    const c = await caches.open('herna-v' + self.HERNA_VERZE);
    for (const h of HRY) if (!(await c.match(h.soubory[1]))) return false;
    return true;
  } catch (e) { return false; }
}
async function obnovStav(){
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) { status(false, 'Offline režim jde jen na webové adrese'); return; }
  if (await zkontroluj()) status(true, nainstalovano ? 'Všechny hry fungují offline – i ve vlaku 🚆' : 'Všechny hry fungují offline – i ve vlaku 🚆');
  else status(false, navigator.onLine ? 'Chystám hry na hraní bez internetu…' : 'Připoj se jednou k internetu, pak pojedou hry i offline');
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { try { r.update(); } catch (e) {} }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', obnovStav);
  navigator.serviceWorker.ready.then(obnovStav);
}
obnovStav();
let tik = 0; const iv = setInterval(() => { obnovStav(); if (++tik > 15) clearInterval(iv); }, 1500);

// --- stažení na plochu ---
let vyzva = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); vyzva = e; });
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (nainstalovano) $('installBtn').classList.add('hidden');
$('installBtn').onclick = () => {
  if (vyzva) { vyzva.prompt(); vyzva = null; return; }
  if (nainstalovano) {
    $('helpTitle').textContent = 'Herna je stažená 🎉';
    $('helpBody').innerHTML = '<div class="note" style="font-size:15px;color:#3a3350">Hry máš v telefonu a jedou i bez internetu. Když přidáme novou hru, stačí Hernu jednou otevřít s internetem a stáhne se sama.</div>';
  } else if (ios) {
    $('helpTitle').textContent = 'Stažení na iPhone';
    $('helpBody').innerHTML = '<ol><li>Otevři tuhle stránku v <b>Safari</b>.</li><li>Dole klepni na <span class="ic">Sdílet ⬆︎</span>.</li><li>Sjeď níž a vyber <span class="ic">Přidat na plochu ➕</span>.</li><li>Klepni na <b>Přidat</b>.</li></ol><div class="note">Na ploše se objeví ikona <b>Herna</b>. Spouštěj hry přes ni, pak jedou i bez internetu a postup se ti nesmaže.</div>';
  } else {
    $('helpTitle').textContent = 'Stažení do telefonu';
    $('helpBody').innerHTML = '<ol><li>Otevři stránku v <b>Chrome</b>.</li><li>Klepni na <span class="ic">⋮</span> vpravo nahoře.</li><li>Vyber <span class="ic">Přidat na plochu</span> nebo <span class="ic">Nainstalovat aplikaci</span>.</li></ol><div class="note">Pak se Herna spouští z ikony na ploše a hry jedou i bez internetu.</div>';
  }
  $('help').classList.remove('hidden');
};
$('helpClose').onclick = () => $('help').classList.add('hidden');
</script>
</body>
</html>
