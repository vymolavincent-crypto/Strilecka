<!DOCTYPE html>
<!-- herna-ok -->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vesmírná střílečka">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="ikona.png">
<title>Vesmírné pexeso</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
:root{--acc:#5ee7ff}
body{font-family:ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,"Courier New",monospace;color:#dfe6ff;background:#0b0d26;display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.top{width:100%;max-width:520px;display:flex;align-items:center;gap:8px}
.round{width:38px;height:38px;background:#151a44;color:#dfe6ff;font-size:16px;font-weight:900;box-shadow:0 0 0 3px #2c3778;flex:none;margin:3px}
h1{flex:1;margin:0;text-align:center;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);text-shadow:3px 3px 0 #05061a}
.mode{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap;justify-content:center}
.mode button,.act{padding:9px 12px;background:#151a44;color:#dfe6ff;font-weight:900;font-size:12.5px;text-transform:uppercase;box-shadow:0 0 0 3px #2c3778;margin:3px}
.mode button.on,.act.main{background:var(--acc);color:#0b0d26;box-shadow:0 0 0 3px var(--acc),inset 0 -4px 0 0 rgba(0,0,0,.25)}
.act:disabled{opacity:.45}
.act:active,.mode button:active,.round:active{transform:translate(2px,2px)}
#msg{min-height:24px;font-size:14px;font-weight:800;color:#ffd166;margin:6px 0;text-align:center;text-transform:uppercase;letter-spacing:1px}
.bottom{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.label{font-size:12px;font-weight:800;text-transform:uppercase;color:#8fa0d8;margin:8px 0 4px;letter-spacing:1px}
.hidden{display:none!important}

.players{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:420px;margin-top:4px}
.pl{padding:6px 10px;background:#151a44;box-shadow:0 0 0 3px #2c3778;font-size:12.5px;font-weight:900;text-transform:uppercase;opacity:.5;color:var(--c)}
.pl.on{opacity:1;box-shadow:0 0 0 3px var(--c)}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(92vw,400px);padding:10px;background:#2c3778;box-shadow:0 0 0 4px var(--acc),8px 8px 0 4px #05061a;margin-top:10px}
.card{aspect-ratio:1;padding:0;border:0;background:repeating-linear-gradient(45deg,#1d2565 0 6px,#151a44 6px 12px);box-shadow:inset 0 0 0 3px #3a4a8a}
.card.open{background:#f4f6ff;background-image:var(--s);background-size:78%;background-position:center;background-repeat:no-repeat;box-shadow:0 0 0 3px #ffffff}
.card.done{background:#1d2a5a;background-image:var(--s);background-size:66%;background-position:center;background-repeat:no-repeat;opacity:.4;box-shadow:none}


</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="top"><button class="round" id="homeBtn" aria-label="Menu">⌂</button><h1>Vesmírné pexeso</h1><div style="width:42px"></div></div>

<div class="mode" id="mode"><button data-n="2" class="on">2 hráči</button><button data-n="3">3 hráči</button><button data-n="4">4 hráči</button></div>
<div id="players" class="players"></div>
<div id="msg"></div>
<div id="grid"></div>
<div class="bottom"><button class="act main" id="newBtn">↻ Nová hra</button></div>

<script>
(() => {
const bg=document.getElementById('bg'),bc=bg.getContext('2d');let st=[];
const size=()=>{bg.width=Math.ceil(innerWidth/3);bg.height=Math.ceil(innerHeight/3);st=Array.from({length:70},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,v:.02+Math.random()*.08,c:Math.random()<.15?'#ffffff':'#5f6cb8'}));};
const frame=()=>{bc.fillStyle='#0b0d26';bc.fillRect(0,0,bg.width,bg.height);for(const s of st){s.y+=s.v;if(s.y>bg.height){s.y=0;s.x=Math.random()*bg.width;}bc.fillStyle=s.c;bc.fillRect(s.x|0,s.y|0,1,1);}requestAnimationFrame(frame);};
addEventListener('resize',size);size();frame();
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
let AC=null;
function beep(f,d,v=.12,t='triangle'){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d);}catch(_){}}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(_){}}
function sprite(rows,pal){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1);}}));return 'url('+c.toDataURL()+')';}
$('homeBtn').onclick=()=>location.href='../../index.html';

const COLS=['#5ee7ff','#ff6bd6','#ffd166','#7dffa8'];
const G=(id,a,b)=>`<radialGradient id="${id}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`;
const SYMS=[
 {d:G('g1','#fff3a0','#ff9f1c')+`<circle cx="32" cy="32" r="30" fill="none"/><g stroke="#ffd166" stroke-width="4" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="32" y1="6" x2="32" y2="14" transform="rotate(${a} 32 32)"/>`).join('')}</g><circle cx="32" cy="32" r="16" fill="url(#g1)"/>`},
 {d:G('g2','#fffbe6','#c9d4ff')+`<circle cx="32" cy="32" r="22" fill="url(#g2)"/><circle cx="25" cy="26" r="4" fill="#9aa6d6" opacity=".5"/><circle cx="38" cy="38" r="5" fill="#9aa6d6" opacity=".5"/><circle cx="36" cy="22" r="2.5" fill="#9aa6d6" opacity=".5"/><circle cx="50" cy="12" r="1.6" fill="#fff"/><circle cx="12" cy="50" r="1.4" fill="#fff"/><circle cx="54" cy="46" r="1.2" fill="#fff"/>`},
 {d:G('g3','#ffffff','#ffd166')+`<path d="M32 6 L39 24 L58 25 L43 37 L48 56 L32 45 L16 56 L21 37 L6 25 L25 24 Z" fill="url(#g3)" stroke="#ff9f1c" stroke-width="2" stroke-linejoin="round"/>`},
 {d:G('g4','#ffb3d1','#ff2e63')+`<path d="M32 56 C10 40 6 28 10 19 C14 10 26 8 32 18 C38 8 50 10 54 19 C58 28 54 40 32 56 Z" fill="url(#g4)"/><path d="M18 22 C20 16 25 14 29 16" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>`},
 {d:G('g5','#ffffff','#9fb0ea')+`<ellipse cx="32" cy="36" rx="24" ry="8" fill="none" stroke="#ffd166" stroke-width="3" transform="rotate(-18 32 36)"/><circle cx="32" cy="32" r="16" fill="url(#g5)"/><circle cx="26" cy="26" r="4" fill="#ffffff" opacity=".5"/><path d="M14 40 Q32 50 52 34" stroke="#ffd166" stroke-width="3" fill="none" opacity=".0"/><ellipse cx="32" cy="36" rx="24" ry="8" fill="none" stroke="#ffd166" stroke-width="3" transform="rotate(-18 32 36) translate(0 0)" stroke-dasharray="0 0" opacity=".0"/>`},
 {d:G('g6','#fff7e0','#ff9f1c')+`<path d="M22 6 C18 22 26 30 32 32 C26 36 20 44 22 58 L30 58 C28 44 34 36 40 32 C34 30 28 22 30 6 Z" fill="url(#g6)" opacity="0"/><path d="M14 52 C12 36 22 24 32 14 C42 24 52 36 50 52 Z" fill="url(#g6)" stroke="#ff9f1c" stroke-width="2"/><rect x="26" y="50" width="12" height="8" rx="3" fill="#c0392b"/><path d="M22 24 Q32 20 42 24" stroke="#ff6b6b" stroke-width="3" fill="none"/><circle cx="26" cy="32" r="2.5" fill="#c0392b"/><circle cx="38" cy="36" r="2.5" fill="#c0392b"/>`},
 {d:G('g7','#c9ffe0','#2bd47d')+`<path d="M6 32 C14 18 28 16 36 22 L50 14 L46 32 L50 50 L36 42 C28 48 14 46 6 32 Z" fill="url(#g7)" stroke="#1aa35f" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="30" r="3.5" fill="#05061a"/><circle cx="20" cy="29" r="1.2" fill="#fff"/><path d="M28 27 L28 37 M33 28 L33 36" stroke="#1aa35f" stroke-width="2" opacity=".6"/>`},
 {d:G('g8','#ffe0a3','#ffb347')+`<path d="M6 40 C6 22 20 12 32 12 C44 12 58 22 58 40 Z" fill="url(#g8)"/><path d="M10 44 C10 52 54 52 54 44 Z" fill="#fff"/><g fill="#ff4d6d"><circle cx="20" cy="28" r="3"/><circle cx="34" cy="22" r="3"/><circle cx="46" cy="32" r="3"/><circle cx="28" cy="36" r="2.5"/></g><path d="M8 44 H56" stroke="#c96a2b" stroke-width="2" opacity=".4"/>`},
 {d:G('g9','#9ff7ff','#1e90ff')+`<path d="M10 22 L22 8 L42 8 L54 22 L32 56 Z" fill="url(#g9)" stroke="#0a5fbf" stroke-width="2" stroke-linejoin="round"/><path d="M10 22 H54 M22 8 L32 22 L42 8 M32 22 L32 56" stroke="#0a5fbf" stroke-width="1.6" fill="none" opacity=".5"/><path d="M18 14 L24 12" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>`},
 {d:G('g10','#eaffc2','#7bc043')+`<path d="M32 10 C48 10 56 22 54 36 C52 50 42 56 32 56 C22 56 12 50 10 36 C8 22 16 10 32 10 Z" fill="url(#g10)"/><path d="M32 12 C34 4 42 2 48 4" stroke="#4b7d2a" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="24" cy="26" rx="4" ry="6" fill="#fff" opacity=".5" transform="rotate(20 24 26)"/>`},
 {d:G('g11','#ffd6e8','#ff6bd6')+`<g fill="url(#g11)">${[0,72,144,216,288].map(a=>`<ellipse cx="32" cy="20" rx="9" ry="13" transform="rotate(${a} 32 32)"/>`).join('')}</g><circle cx="32" cy="32" r="7" fill="#ffd166"/><circle cx="30" cy="30" r="2" fill="#fff" opacity=".7"/>`},
 {d:G('g12','#ffe27a','#ffb000')+`<path d="M34 4 L14 36 H30 L26 60 L50 26 H34 L40 4 Z" fill="url(#g12)" stroke="#e08a00" stroke-width="2" stroke-linejoin="round"/>`},
 {d:G('g13','#8ef0ff','#2d7dff')+`<path d="M32 6 L56 20 V44 L32 58 L8 44 V20 Z" fill="url(#g13)" stroke="#1b4fb8" stroke-width="2" stroke-linejoin="round"/><path d="M32 6 V58 M8 20 L56 44 M56 20 L8 44" stroke="#fff" stroke-width="1.2" opacity=".25"/>`},
 {d:G('g14','#ffd0c4','#ff5a3c')+`<ellipse cx="32" cy="22" rx="22" ry="16" fill="url(#g14)"/><path d="M24 10 Q32 0 40 10" stroke="#3b7d2a" stroke-width="3" fill="none"/><rect x="20" y="36" width="24" height="18" rx="6" fill="#ffe27a"/><circle cx="24" cy="44" r="2" fill="#c0392b"/><circle cx="40" cy="48" r="2" fill="#c0392b"/><circle cx="32" cy="52" r="2" fill="#c0392b"/>`},
 {d:G('g15','#e6d4ff','#8e5bff')+`<path d="M32 8 L40 22 L56 24 L44 36 L48 54 L32 46 L16 54 L20 36 L8 24 L24 22 Z" fill="url(#g15)" stroke="#5b2fd6" stroke-width="2" stroke-linejoin="round"/><circle cx="32" cy="30" r="5" fill="#fff" opacity=".8"/>`}
];
const svgUrl=s=>'url("data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs>${SYMS[s].d.match(/<defs>/)?'':''}</defs>${SYMS[s].d}</svg>`)+'")';
let n=2,turn=0,score=[],first=null,lock=false,matched=0,over=false;
function msg(t){$('msg').textContent=t;}
function name(p){return 'Hráč '+(p+1);}
function updatePlayers(){
  document.querySelectorAll('#players .pl').forEach((el,p)=>el.classList.toggle('on',!over&&p===turn));
}
function build(){
  turn=0;score=new Array(n).fill(0);first=null;lock=false;matched=0;over=false;
  const bar=$('players');bar.innerHTML='';
  for(let p=0;p<n;p++){
    const d=document.createElement('div');d.className='pl';d.style.setProperty('--c',COLS[p]);d.textContent=name(p)+': 0';bar.appendChild(d);
  }
  const ids=[];for(let s=0;s<15;s++){ids.push(s,s);}
  for(let i=ids.length-1;i>0;i--){const j=rnd(i+1);[ids[i],ids[j]]=[ids[j],ids[i]];}
  const g=$('grid');g.innerHTML='';
  ids.forEach(s=>{
    const b=document.createElement('button');b.className='card';b.dataset.s=s;
    b.style.setProperty('--s',svgUrl(s));
    b.onclick=()=>flip(b);g.appendChild(b);
  });
  msg('Na tahu: '+name(0));updatePlayers();
}
function flip(card){
  if(lock||over||card.classList.contains('open')||card.classList.contains('done'))return;
  card.classList.add('open');beep(500,.06,.06);
  if(first===null){first=card;return;}
  const a=first,b=card;first=null;lock=true;
  if(a.dataset.s===b.dataset.s){
    setTimeout(()=>{
      a.classList.remove('open');b.classList.remove('open');a.classList.add('done');b.classList.add('done');
      score[turn]++;matched++;
      $('players').children[turn].textContent=name(turn)+': '+score[turn];
      beep(880,.15,.12);vib(20);
      lock=false;
      if(matched===15)endGame();
      else{msg(name(turn)+' našel pár! Hraje znovu.');updatePlayers();}
    },450);
  }else{
    beep(220,.12,.08,'sine');
    setTimeout(()=>{
      a.classList.remove('open');b.classList.remove('open');
      turn=(turn+1)%n;lock=false;
      msg('Na tahu: '+name(turn));updatePlayers();
    },900);
  }
}
function endGame(){
  over=true;
  const best=Math.max(...score);
  const winners=score.map((s,p)=>s===best?p:-1).filter(p=>p>=0);
  msg(winners.length>1?'Remíza mezi hráči!':'Vyhrál '+name(winners[0])+' 🏆');
  beep(660,.3,.14);updatePlayers();
}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{
  n=+b.dataset.n;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));build();
});
$('newBtn').onclick=build;
build();

})();
</script>
</body>
</html>
