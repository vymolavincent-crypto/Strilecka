<!DOCTYPE html>
<!-- herna-ok -->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vesmírná střílečka">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="ikona.png">
<title>Čtyři v řadě</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
body{font-family:ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,"Courier New",monospace;color:#dfe6ff;background:#0b0d26;
  display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
canvas,img{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;cursor:pointer;border:0}
.top{width:100%;max-width:520px;display:flex;align-items:center;gap:8px}
.round{width:38px;height:38px;background:#151a44;color:#dfe6ff;font-size:16px;font-weight:900;box-shadow:0 0 0 3px #2c3778;flex:none;margin:3px}
h1{flex:1;margin:0;text-align:center;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);text-shadow:3px 3px 0 #05061a}
.mode{display:flex;gap:6px;margin:12px 0 10px}
.mode button{padding:8px 12px;background:#151a44;color:#8fa0d8;font-weight:800;font-size:12.5px;box-shadow:0 0 0 3px #2c3778;text-transform:uppercase}
.mode button.on{background:var(--acc);color:#0b0d26;box-shadow:0 0 0 3px var(--acc)}
.score{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.pl{display:flex;align-items:center;gap:7px;padding:6px 10px;background:#151a44;opacity:.5;box-shadow:0 0 0 3px #2c3778;margin:3px}
.pl.on{opacity:1;box-shadow:0 0 0 3px var(--c);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{box-shadow:0 0 0 3px #2c3778}}
.pl i{display:inline-block;width:18px;height:18px;background-size:100% 100%;image-rendering:pixelated}
#msg{height:24px;font-size:14px;font-weight:800;color:#ffd166;margin-bottom:8px;text-align:center;text-transform:uppercase;letter-spacing:1px}
.bottom{display:flex;gap:12px;margin-top:16px}
.act{padding:11px 14px;background:#151a44;color:#dfe6ff;font-weight:900;font-size:13px;text-transform:uppercase;box-shadow:0 0 0 3px #2c3778;margin:3px}
.act:active,.mode button:active{transform:translate(2px,2px)}
.act.main{background:var(--acc);color:#0b0d26;box-shadow:0 0 0 3px var(--acc),inset 0 -4px 0 0 rgba(0,0,0,.25)}
:root{--acc:#ffd166}
#board{position:relative;display:grid;grid-template-columns:repeat(7,var(--s));grid-auto-rows:var(--s);gap:var(--g);padding:var(--g);background:#2c3778;box-shadow:0 0 0 4px #5ee7ff,0 0 0 8px #0b0d26,8px 8px 0 4px #05061a}
.hole{background-image:var(--hole);background-size:100% 100%;image-rendering:pixelated}
.disc{position:absolute;width:var(--s);height:var(--s);pointer-events:none;background-size:100% 100%;image-rendering:pixelated}
.disc.r{background-image:var(--dr)}.disc.y{background-image:var(--dy)}
.disc.win{animation:glow .5s steps(2) infinite}
@keyframes glow{50%{background-image:var(--dw)}}
.col{position:absolute;top:0;bottom:0;cursor:pointer}
.col:active{background:rgba(255,255,255,.06)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="top">
  <button class="round" id="homeBtn" aria-label="Menu">⌂</button>
  <h1>Čtyři v řadě</h1>
  <div style="width:42px"></div>
</div>
<div class="mode" id="mode"><button data-m="2" class="on">👥 Dva hráči</button><button data-m="ai">🤖 Počítač</button></div>
<div class="score">
  <div class="pl" id="plR" style="--c:#ff6b6b"><i style="background-image:var(--dr)"></i><span id="nR">Hráč 1</span> <span id="sR">0</span></div>
  <div class="pl" id="plY" style="--c:#ffd166"><i style="background-image:var(--dy)"></i><span id="nY">Hráč 2</span> <span id="sY">0</span></div>
</div>
<div id="msg"></div>
<div id="wrap"><div id="board"></div></div>
<div class="bottom">
  <button class="act" id="undoBtn">↶ Zpět tah</button>
  <button class="act main" id="newBtn">↻ Nová hra</button>
</div>

<script>
(() => {
// ---------- pixelové obrázky a vesmírné pozadí ----------
(function pixelArt(){
  const mk = (rows, pal) => { const h = rows.length, w = rows[0].length, c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } })); return 'url(' + c.toDataURL() + ')'; };
  const X = ["aa.....aa","abb...bba",".abb.bba.","..abbba..","...bbb...","..abbba..",".abb.bba.","abb...bba","aa.....aa"];
  const O = ["..aaaaa..",".abbbbba.","abb...bba","ab.....ba","ab.....ba","ab.....ba","abb...bba",".abbbbba.","..aaaaa.."];
  const D = ["...aaaa...",".aabbbbaa.",".abwbbbbba","abwbbbbbba","abbbbbbbba","abbbbbbbca","abbbbbbbca",".abbbbcca.",".aaccccaa.","...aaaa..."];
  const HO = ["...aaaa...",".aabbbbaa.",".abbbbbbb.","abbbbbbbbb","abbbbbbbbb","abbbbbbbbb","abbbbbbbbb",".bbbbbbbb.","..bbbbbb..","...bbbb..."];
  const r = document.documentElement.style;
  r.setProperty('--sx', mk(X, { a:'#2a6fd6', b:'#5ee7ff' }));
  r.setProperty('--so', mk(O, { a:'#b8379a', b:'#ff6bd6' }));
  r.setProperty('--dr', mk(D, { a:'#7a1f33', b:'#ff6b6b', c:'#c23b4a', w:'#ffd0d0' }));
  r.setProperty('--dy', mk(D, { a:'#7a5a10', b:'#ffd166', c:'#d9a020', w:'#fff6d0' }));
  r.setProperty('--dw', mk(D, { a:'#ffffff', b:'#ffffff', c:'#dfe6ff', w:'#ffffff' }));
  r.setProperty('--hole', mk(HO, { a:'#05061a', b:'#0b0d26' }));
  const bg = document.getElementById('bg'); if (!bg) return; const bc = bg.getContext('2d'); let st = [];
  const size = () => { bg.width = Math.ceil(innerWidth / 3); bg.height = Math.ceil(innerHeight / 3); st = Array.from({ length: 70 }, () => ({ x: Math.random() * bg.width, y: Math.random() * bg.height, v: .02 + Math.random() * .08, c: Math.random() < .15 ? '#ffffff' : Math.random() < .5 ? '#5f6cb8' : '#2c3570' })); };
  const frame = () => { bc.fillStyle = '#0b0d26'; bc.fillRect(0, 0, bg.width, bg.height); for (const s of st) { s.y += s.v; if (s.y > bg.height) { s.y = 0; s.x = Math.random() * bg.width; } bc.fillStyle = s.c; bc.fillRect(s.x | 0, s.y | 0, 1, 1); } requestAnimationFrame(frame); };
  addEventListener('resize', size); size(); frame();
})();

const $ = id => document.getElementById(id);
const C = 7, R = 6, AI = 'y';
let g, moves, turn, over, vsAI = false, starter = 'r', score = { r: 0, y: 0 }, S = 44, G = 6, busy = false;
const discEls = {};

function layout(){
  const avW = Math.min(innerWidth - 20, 520), avH = innerHeight - $('wrap').getBoundingClientRect().top - 90;
  S = Math.floor(Math.min((avW - 8 * 6) / C, (avH - 7 * 6) / R, 70)); G = Math.max(4, Math.round(S * 0.12));
  S = Math.floor(Math.min((avW - 8 * G) / C, (avH - 7 * G) / R, 70));
  document.body.style.setProperty('--s', S + 'px'); document.body.style.setProperty('--g', G + 'px');
  for (const k in discEls) { const [c, r] = k.split(',').map(Number); pos(discEls[k], c, r); }
  buildCols();
}
function pos(el, c, r){ el.style.left = (G + c * (S + G)) + 'px'; el.style.top = (G + (R - 1 - r) * (S + G)) + 'px'; }
function buildHoles(){ $('board').innerHTML = ''; for (let i = 0; i < C * R; i++) { const h = document.createElement('div'); h.className = 'hole'; $('board').appendChild(h); } }
function buildCols(){
  document.querySelectorAll('.col').forEach(e => e.remove());
  for (let c = 0; c < C; c++) {
    const d = document.createElement('div'); d.className = 'col'; d.dataset.c = c;
    d.style.left = (G / 2 + c * (S + G)) + 'px'; d.style.width = (S + G) + 'px';
    $('board').appendChild(d);
  }
}
function newGame(){
  g = Array.from({ length: C }, () => []); moves = []; over = false; turn = starter; busy = false;
  for (const k in discEls) { discEls[k].remove(); delete discEls[k]; }
  update();
  if (vsAI && turn === AI) setTimeout(aiMove, 450);
}
const name = p => vsAI ? (p === AI ? 'Počítač' : 'Ty') : (p === 'r' ? 'Hráč 1' : 'Hráč 2');
function update(){
  $('nR').textContent = name('r'); $('nY').textContent = name('y'); $('sR').textContent = score.r; $('sY').textContent = score.y;
  $('plR').classList.toggle('on', !over && turn === 'r'); $('plY').classList.toggle('on', !over && turn === 'y');
  if (!over) $('msg').textContent = vsAI ? (turn === AI ? 'Počítač přemýšlí…' : 'Jsi na tahu – klepni na sloupec') : 'Na tahu: ' + name(turn);
  $('undoBtn').style.opacity = moves.length ? 1 : .5;
}
function at(c, r){ return c >= 0 && c < C && r >= 0 && r < R ? (g[c][r] || '') : ''; }
function winLine(c, r, p){
  for (const [dc, dr] of [[1,0],[0,1],[1,1],[1,-1]]) {
    const L = [[c, r]];
    for (const s of [1, -1]) { let cc = c + dc * s, rr = r + dr * s; while (at(cc, rr) === p) { L.push([cc, rr]); cc += dc * s; rr += dr * s; } }
    if (L.length >= 4) return L;
  }
  return null;
}
let AC = null;
function beep(f, d, v = 0.12){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
  const t = AC.currentTime, o = AC.createOscillator(), gn = AC.createGain(); o.type = 'triangle'; o.frequency.value = f; gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(gn); gn.connect(AC.destination); o.start(t); o.stop(t + d); } catch (_) {} }

function drop(c){
  if (over || busy || g[c].length >= R) return;
  const r = g[c].length, p = turn;
  g[c].push(p); moves.push(c);
  const d = document.createElement('div'); d.className = 'disc ' + p;
  pos(d, c, r); const endTop = d.style.top;
  d.style.top = (-S - G) + 'px'; $('board').appendChild(d); discEls[c + ',' + r] = d;
  const dist = (R - r) * (S + G) + S;
  d.animate([{ top: (-S - G) + 'px' }, { top: endTop, offset: .8 }, { top: (parseFloat(endTop) - S * .12) + 'px', offset: .9 }, { top: endTop }],
            { duration: 180 + dist * 0.9, easing: 'ease-in' });
  d.style.top = endTop;
  busy = true;
  setTimeout(() => {
    busy = false; beep(p === 'r' ? 360 : 300, 0.09);
    const w = winLine(c, r, p);
    if (w) {
      over = true; score[p]++; starter = starter === 'r' ? 'y' : 'r';
      w.forEach(([cc, rr]) => discEls[cc + ',' + rr].classList.add('win'));
      $('msg').textContent = vsAI ? (p === AI ? 'Počítač vyhrál 🤖' : 'Vyhrál jsi! 🎉') : name(p) + ' vyhrál! 🎉';
      beep(523, .15, .15); setTimeout(() => beep(659, .15, .15), 140); setTimeout(() => beep(784, .3, .15), 280);
      try { navigator.vibrate && navigator.vibrate(100); } catch (_) {}
    } else if (moves.length === C * R) { over = true; $('msg').textContent = 'Remíza 🤝'; starter = starter === 'r' ? 'y' : 'r'; }
    else turn = p === 'r' ? 'y' : 'r';
    update();
    if (!over && vsAI && turn === AI) setTimeout(aiMove, 300);
  }, 180 + dist * 0.9);
}

// ---------- počítač (minimax) ----------
function scoreWin(a){ let s = 0;
  const me = a.filter(x => x === AI).length, op = a.filter(x => x && x !== AI).length, e = a.filter(x => !x).length;
  if (me === 4) s += 1000; else if (me === 3 && e === 1) s += 6; else if (me === 2 && e === 2) s += 2;
  if (op === 3 && e === 1) s -= 8; else if (op === 2 && e === 2) s -= 2;
  return s; }
function evalBoard(){
  let s = 0;
  for (let r = 0; r < R; r++) if (at(3, r) === AI) s += 3; else if (at(3, r)) s -= 3;
  for (let c = 0; c < C; c++) for (let r = 0; r < R; r++) for (const [dc, dr] of [[1,0],[0,1],[1,1],[1,-1]]) {
    const ec = c + dc * 3, er = r + dr * 3; if (ec < 0 || ec >= C || er < 0 || er >= R) continue;
    s += scoreWin([0,1,2,3].map(k => at(c + dc * k, r + dr * k)));
  }
  return s;
}
const ORDER = [3, 2, 4, 1, 5, 0, 6];
function minimax(depth, a, b, maxP, lastC){
  if (lastC != null) { const r = g[lastC].length - 1, p = g[lastC][r]; if (winLine(lastC, r, p)) return p === AI ? 100000 + depth : -100000 - depth; }
  if (depth === 0 || moves.length === C * R) return evalBoard();
  let best = maxP ? -Infinity : Infinity;
  for (const c of ORDER) {
    if (g[c].length >= R) continue;
    g[c].push(maxP ? AI : 'r'); moves.push(c);
    const v = minimax(depth - 1, a, b, !maxP, c);
    g[c].pop(); moves.pop();
    if (maxP) { best = Math.max(best, v); a = Math.max(a, v); } else { best = Math.min(best, v); b = Math.min(b, v); }
    if (a >= b) break;
  }
  return best;
}
function aiMove(){
  if (over || turn !== AI || busy) return;
  let best = -Infinity, bc = 3;
  for (const c of ORDER) {
    if (g[c].length >= R) continue;
    g[c].push(AI); moves.push(c);
    const v = minimax(5, -Infinity, Infinity, false, c) + Math.random();
    g[c].pop(); moves.pop();
    if (v > best) { best = v; bc = c; }
  }
  drop(bc);
}

// ---------- ovládání ----------
$('board').addEventListener('click', e => {
  const col = e.target.closest('.col'); if (!col) return;
  if (vsAI && turn === AI) return;
  drop(+col.dataset.c);
});
$('undoBtn').onclick = () => {
  if (!moves.length || busy) return;
  if (over) { const c = moves[moves.length - 1], r = g[c].length - 1, p = g[c][r]; if (winLine(c, r, p)) { score[p]--; starter = starter === 'r' ? 'y' : 'r'; } over = false; }
  const pop = () => { const c = moves.pop(), r = g[c].length - 1, p = g[c].pop(); discEls[c + ',' + r].remove(); delete discEls[c + ',' + r]; turn = p; return p; };
  if (vsAI) { while (moves.length) { if (pop() !== AI) break; } } else pop();
  Object.values(discEls).forEach(d => d.classList.remove('win'));
  update();
  if (vsAI && turn === AI) setTimeout(aiMove, 350);
};
$('newBtn').onclick = () => { if (!busy) newGame(); };
$('mode').onclick = e => {
  const b = e.target.closest('button'); if (!b || busy) return;
  vsAI = b.dataset.m === 'ai'; [...$('mode').children].forEach(x => x.classList.toggle('on', x === b));
  score = { r: 0, y: 0 }; starter = 'r'; newGame();
};
$('homeBtn').onclick = () => { location.href = '../../index.html'; };
addEventListener('resize', layout);
buildHoles(); layout(); newGame();
try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('../../sw.js', { updateViaCache: 'none' }).catch(() => {}); } catch (_) {}
})();
</script>
<!-- xmas-snow -->
<canvas id="xmasSnow" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40"></canvas>
<script>
(function(){
var c=document.getElementById('xmasSnow'),g=c.getContext('2d'),F=[];
function size(){c.width=Math.ceil(innerWidth/3);c.height=Math.ceil(innerHeight/3);}
function init(){F=[];for(var i=0;i<45;i++)F.push({x:Math.random()*c.width,y:Math.random()*c.height,v:.12+Math.random()*.25,s:Math.random()*6});}
function frame(){g.clearRect(0,0,c.width,c.height);g.fillStyle='#ffffff';
for(var i=0;i<F.length;i++){var f=F[i];f.y+=f.v;f.x+=Math.sin(f.y*.2+f.s)*.15;if(f.y>c.height){f.y=-2;f.x=Math.random()*c.width;}g.fillRect(f.x|0,f.y|0,1,1);}
requestAnimationFrame(frame);}
addEventListener('resize',function(){size();});size();init();frame();
})();
</script>
</body>
</html>
