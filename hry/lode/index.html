<!DOCTYPE html>
<!-- herna-ok -->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vesmírná střílečka">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="ikona.png">
<title>Námořní bitva</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
:root{--acc:#5ee7ff}
body{font-family:ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,"Courier New",monospace;color:#dfe6ff;background:#0b0d26;display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.top{width:100%;max-width:520px;display:flex;align-items:center;gap:8px}
.round{width:38px;height:38px;background:#151a44;color:#dfe6ff;font-size:16px;font-weight:900;box-shadow:0 0 0 3px #2c3778;flex:none;margin:3px}
h1{flex:1;margin:0;text-align:center;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);text-shadow:3px 3px 0 #05061a}
.mode{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap;justify-content:center}
.mode button,.act{padding:9px 12px;background:#151a44;color:#dfe6ff;font-weight:900;font-size:12.5px;text-transform:uppercase;box-shadow:0 0 0 3px #2c3778;margin:3px}
.mode button.on,.act.main{background:var(--acc);color:#0b0d26;box-shadow:0 0 0 3px var(--acc),inset 0 -4px 0 0 rgba(0,0,0,.25)}
.act:disabled{opacity:.45}
.act:active,.mode button:active,.round:active{transform:translate(2px,2px)}
#msg{min-height:24px;font-size:14px;font-weight:800;color:#ffd166;margin:6px 0;text-align:center;text-transform:uppercase;letter-spacing:1px}
.bottom{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.label{font-size:12px;font-weight:800;text-transform:uppercase;color:#8fa0d8;margin:8px 0 4px;letter-spacing:1px}
.hidden{display:none!important}

.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:#2c3778;padding:4px;width:min(92vw,340px);box-shadow:0 0 0 4px var(--acc),8px 8px 0 4px #05061a}
.grid.small{width:min(56vw,190px);box-shadow:0 0 0 3px #2c3778}
.c{aspect-ratio:1;background:#111640;padding:0;min-width:0;display:block;border:0}
button.c:active{background:#1a2160}
.c.ship{background:#5f6cb8}
.c.m{background:#1d2a5a;box-shadow:inset 0 0 0 3px #3a4a8a}
.c.h{background:#ff4d6d;box-shadow:inset 0 0 0 3px #ffd0d0}
.c.s{background:#7a1f33;box-shadow:inset 0 0 0 3px #ff4d6d}
.c.ok{cursor:crosshair}
#pass{position:fixed;inset:0;background:rgba(5,6,26,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5;text-align:center;padding:20px}
#passTxt{font-size:18px;font-weight:900;color:var(--acc);text-transform:uppercase;letter-spacing:1px}

</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="top"><button class="round" id="homeBtn" aria-label="Menu">⌂</button><h1>Námořní bitva</h1><div style="width:42px"></div></div>

<div class="mode" id="mode"><button data-m="ai" class="on">🤖 Počítač</button><button data-m="pvp">👥 Dva hráči</button></div>
<div id="msg"></div>
<div class="label" id="tTitle">Cíl</div>
<div id="target" class="grid"></div>
<div class="label" id="ownTitle">Tvoje flotila</div>
<div id="own" class="grid small"></div>
<div class="bottom"><button class="act main" id="newBtn">↻ Nová hra</button></div>
<div id="pass" class="hidden"><div id="passTxt"></div><button class="act main" id="passBtn" style="font-size:16px;padding:16px 22px">Jsem na tahu</button></div>

<script>
(() => {
const bg=document.getElementById('bg'),bc=bg.getContext('2d');let st=[];
const size=()=>{bg.width=Math.ceil(innerWidth/3);bg.height=Math.ceil(innerHeight/3);st=Array.from({length:70},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,v:.02+Math.random()*.08,c:Math.random()<.15?'#ffffff':'#5f6cb8'}));};
const frame=()=>{bc.fillStyle='#0b0d26';bc.fillRect(0,0,bg.width,bg.height);for(const s of st){s.y+=s.v;if(s.y>bg.height){s.y=0;s.x=Math.random()*bg.width;}bc.fillStyle=s.c;bc.fillRect(s.x|0,s.y|0,1,1);}requestAnimationFrame(frame);};
addEventListener('resize',size);size();frame();
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
let AC=null;
function beep(f,d,v=.12,t='triangle'){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d);}catch(_){}}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(_){}}
function sprite(rows,pal){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1);}}));return 'url('+c.toDataURL()+')';}
$('homeBtn').onclick=()=>location.href='../../index.html';

const N=10,FLEET=[5,4,3,3,2],NAMES=['Letadlová loď','Bitevní loď','Křižník','Ponorka','Torpédoborec'];
let boards=[],turn=0,over=false,busy=false,mode='ai',aiQ=[];
function placeFleet(){
  const g=new Array(100).fill(0),ships=[];
  for(let si=0;si<FLEET.length;si++){
    const L=FLEET[si];let ok=false;
    for(let t=0;t<300&&!ok;t++){
      const hor=Math.random()<.5,r=rnd(hor?N:N-L+1),c=rnd(hor?N-L+1:N);
      const cells=[...Array(L)].map((_,k)=>hor?r*N+c+k:(r+k)*N+c);
      if(cells.every(i=>!g[i])){cells.forEach(i=>g[i]=si+1);ships.push({name:NAMES[si],cells,hit:0});ok=true;}
    }
    if(!ok)return placeFleet();
  }
  return {g,ships,hits:new Array(100).fill(0)};
}
function who(p){return mode==='ai'?(p===0?'Ty':'Počítač'):'Hráč '+(p+1);}
function msg(t){$('msg').textContent=t;}
function newGame(){boards=[placeFleet(),placeFleet()];turn=0;over=false;busy=false;aiQ=[];$('pass').classList.add('hidden');render();msg('Na tahu: '+who(0));}
function shoot(bi,i){
  const b=boards[bi];if(b.hits[i])return null;
  if(b.g[i]){b.hits[i]=2;const s=b.ships[b.g[i]-1];s.hit++;return {hit:true,sunk:s.hit===s.cells.length?s:null};}
  b.hits[i]=1;return {hit:false,sunk:null};
}
function allSunk(b){return b.ships.every(s=>s.hit===s.cells.length);}
function fire(i){
  if(over||busy||!$('pass').classList.contains('hidden'))return;
  if(mode==='ai'&&turn===1)return;
  const bi=1-turn,r=shoot(bi,i);if(!r)return;
  afterShot(r,turn);
}
function afterShot(r,shooter){
  if(r.sunk){msg('Potopena: '+r.sunk.name+'!');beep(220,.3,.14,'square');vib(60);}
  else if(r.hit){msg('Zásah!');beep(520,.12);vib(20);}
  else{msg('Mimo…');beep(180,.1,.08,'sine');}
  render();
  const target=boards[1-shooter];
  if(allSunk(target)){
    over=true;
    msg(mode==='ai'?(shooter===0?'Vyhrál jsi! 🏆':'Počítač vyhrál'):'Vyhrál '+who(shooter)+' 🏆');
    beep(660,.2,.12);render();return;
  }
  busy=true;
  setTimeout(()=>{
    busy=false;turn=1-turn;
    if(mode==='pvp'){showPass();}
    else{render();msg('Na tahu: '+who(turn));if(turn===1)setTimeout(aiTurn,700);}
  },r.hit?900:700);
}
function showPass(){
  $('passTxt').textContent='Předej telefon: na tahu '+who(turn);
  $('pass').classList.remove('hidden');
  render();
}
$('passBtn').onclick=()=>{$('pass').classList.add('hidden');msg('Na tahu: '+who(turn));};
function neighbours(i){
  const r=i/N|0,c=i%N,out=[];
  if(r>0)out.push(i-N);if(r<N-1)out.push(i+N);if(c>0)out.push(i-1);if(c<N-1)out.push(i+1);
  return out;
}
function aiPick(){
  const b=boards[0];
  while(aiQ.length){const i=aiQ.shift();if(!b.hits[i])return i;}
  const free=[];for(let i=0;i<100;i++)if(!b.hits[i])free.push(i);
  const par=free.filter(i=>((i/N|0)+i%N)%2===0);
  const pool=par.length?par:free;
  return pool[rnd(pool.length)];
}
function aiTurn(){
  if(over||turn!==1)return;
  const i=aiPick();const r=shoot(0,i);if(!r)return;
  if(r.sunk)aiQ=[];
  else if(r.hit)neighbours(i).forEach(n=>{if(!boards[0].hits[n]&&!aiQ.includes(n))aiQ.push(n);});
  afterShot(r,1);
}
function drawGrid(el,b,target){
  el.innerHTML='';
  for(let i=0;i<100;i++){
    const h=b.hits[i];let cls='',d;
    if(target){
      if(h===1)cls='m';
      else if(h===2){const s=b.ships[b.g[i]-1];cls=s.hit===s.cells.length?'s':'h';}
      const clickable=!h&&!over&&!busy&&$('pass').classList.contains('hidden')&&!(mode==='ai'&&turn===1);
      d=document.createElement(clickable?'button':'div');
      if(clickable){cls+=' ok';d.onclick=()=>fire(i);}
    }else{
      if(b.g[i])cls='ship';
      if(h===1)cls='m';
      else if(h===2){const s=b.ships[b.g[i]-1];cls=s.hit===s.cells.length?'s':'h';}
      d=document.createElement('div');
    }
    d.className='c '+cls;el.appendChild(d);
  }
}
function render(){
  const tb=boards[1-turn],ob=boards[turn];
  drawGrid($('target'),tb,true);
  drawGrid($('own'),ob,false);
  $('tTitle').textContent='Cíl: střílí '+who(turn);
  $('ownTitle').textContent='Flotila: '+who(turn);
}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));newGame();
});
$('newBtn').onclick=newGame;
newGame();

})();
</script>
</body>
</html>
