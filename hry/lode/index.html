<!DOCTYPE html>
<!-- herna-ok -->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vesmírná střílečka">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="ikona.png">
<title>Námořní bitva</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
:root{--acc:#5ee7ff}
body{font-family:ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,"Courier New",monospace;color:#dfe6ff;background:#0b0d26;display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.top{width:100%;max-width:520px;display:flex;align-items:center;gap:8px}
.round{width:38px;height:38px;background:#151a44;color:#dfe6ff;font-size:16px;font-weight:900;box-shadow:0 0 0 3px #2c3778;flex:none;margin:3px}
h1{flex:1;margin:0;text-align:center;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);text-shadow:3px 3px 0 #05061a}
.mode{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap;justify-content:center}
.mode button,.act{padding:9px 12px;background:#151a44;color:#dfe6ff;font-weight:900;font-size:12.5px;text-transform:uppercase;box-shadow:0 0 0 3px #2c3778;margin:3px}
.mode button.on,.act.main{background:var(--acc);color:#0b0d26;box-shadow:0 0 0 3px var(--acc),inset 0 -4px 0 0 rgba(0,0,0,.25)}
.act:disabled{opacity:.45}
.act:active,.mode button:active,.round:active{transform:translate(2px,2px)}
#msg{min-height:24px;font-size:14px;font-weight:800;color:#ffd166;margin:6px 0;text-align:center;text-transform:uppercase;letter-spacing:1px}
.bottom{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.label{font-size:12px;font-weight:800;text-transform:uppercase;color:#8fa0d8;margin:8px 0 4px;letter-spacing:1px}
.hidden{display:none!important}

.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:#2c3778;padding:4px;width:min(92vw,56vh,380px);box-shadow:0 0 0 4px var(--acc),8px 8px 0 4px #05061a}
#target{width:min(92vw,40vh,400px)}
#pgrid{width:min(92vw,48vh,380px)}
#own.grid{width:min(72vw,23vh,260px);padding:3px;box-shadow:0 0 0 3px #2c3778,5px 5px 0 3px #05061a}
.c{aspect-ratio:1;background:linear-gradient(180deg,#141d4f,#0c1238);padding:0;min-width:0;display:block;border:0;position:relative;border-radius:2px}
button.c:active{background:#1a2160}
.c.ship{background:linear-gradient(180deg,#b9c8ff 0%,#6f84d8 45%,#3b4c9e 100%);box-shadow:inset 0 0 0 2px #222d6b}
.c.ship::after{content:'';position:absolute;left:18%;right:18%;top:45%;height:10%;background:#dfe8ff;opacity:.55;border-radius:2px}
.c.m::after{content:'';position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:#9fd8ff;box-shadow:0 0 6px #5ee7ff}
.c.h{background:radial-gradient(circle,#ffd166 0%,#ff7a2e 35%,#c21f3a 80%);box-shadow:inset 0 0 0 2px #ffd0d0}
.c.h::after{content:'';position:absolute;inset:22%;border-radius:50%;background:#fff3c4;opacity:.8}
.c.s{background:repeating-linear-gradient(45deg,#7a1f33 0 4px,#4d1020 4px 8px);box-shadow:inset 0 0 0 2px #ff4d6d}
.c.s::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffd0d0;font-weight:900;font-size:60%}
.c.ok{cursor:crosshair}
.c.ok:hover{background:linear-gradient(180deg,#1d2a66,#121a48)}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:50px;width:min(92vw,340px)}
.chip{display:flex;gap:2px;padding:6px;background:#2c3778;box-shadow:0 0 0 3px #5a6080;touch-action:none;cursor:grab}
.chip.v{flex-direction:column}
.chip i{display:block;width:16px;height:16px;background:#5ee7ff}
.ghost{position:fixed;display:flex;gap:2px;pointer-events:none;transform:translate(-50%,-50%);z-index:9;opacity:.9}
.ghost.v{flex-direction:column}
.ghost i{display:block;width:26px;height:26px;background:#5ee7ff;box-shadow:0 0 0 2px #05061a}
#placeUI{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
#pass{position:fixed;inset:0;background:rgba(5,6,26,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5;text-align:center;padding:20px}
#passTxt{font-size:18px;font-weight:900;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
.hidden{display:none!important}

</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="top"><button class="round" id="homeBtn" aria-label="Menu">⌂</button><h1>Námořní bitva</h1><div style="width:42px"></div></div>

<div class="mode" id="mode"><button data-m="ai" class="on">🤖 Počítač</button><button data-m="pvp">👥 Dva hráči</button></div>
<div id="msg"></div>
<div id="placeUI">
  <div class="label" id="pTitle">Rozmísti lodě</div>
  <div id="tray" class="tray"></div>
  <div id="pgrid" class="grid"></div>
  <div class="bottom"><button class="act" id="randBtn">🎲 Náhodně</button><button class="act" id="clrBtn">Vymazat</button><button class="act main" id="doneBtn" disabled>Hotovo</button></div>
</div>
<div id="gameUI" class="hidden">
  <div class="label" id="tTitle">Cíl</div>
  <div id="target" class="grid"></div>
  <div class="label" id="ownTitle">Tvoje flotila</div>
  <div id="own" class="grid small"></div>
  <div class="bottom"><button class="act main" id="newBtn">↻ Nová hra</button></div>
</div>
<div id="pass" class="hidden"><div id="passTxt"></div><button class="act main" id="passBtn" style="font-size:16px;padding:16px 22px">OK</button></div>

<script>
(() => {
const bg=document.getElementById('bg'),bc=bg.getContext('2d');let st=[];
const size=()=>{bg.width=Math.ceil(innerWidth/3);bg.height=Math.ceil(innerHeight/3);st=Array.from({length:70},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,v:.02+Math.random()*.08,c:Math.random()<.15?'#ffffff':'#5f6cb8'}));};
const frame=()=>{bc.fillStyle='#0b0d26';bc.fillRect(0,0,bg.width,bg.height);for(const s of st){s.y+=s.v;if(s.y>bg.height){s.y=0;s.x=Math.random()*bg.width;}bc.fillStyle=s.c;bc.fillRect(s.x|0,s.y|0,1,1);}requestAnimationFrame(frame);};
addEventListener('resize',size);size();frame();
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
let AC=null;
function beep(f,d,v=.12,t='triangle'){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d);}catch(_){}}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(_){}}
function sprite(rows,pal){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1);}}));return 'url('+c.toDataURL()+')';}
$('homeBtn').onclick=()=>location.href='../../index.html';

const N=10,FLEET=[5,4,3,3,2],NAMES=['Letadlová loď','Bitevní loď','Křižník','Ponorka','Torpédoborec'];
let mode='ai',boards=[],turn=0,over=false,busy=false,aiQ=[],pl=null,pIdx=0,drag=null,ghost=null,passCb=null;
function msg(t){$('msg').textContent=t;}
function who(p){return mode==='ai'?(p===0?'Ty':'Počítač'):'Hráč '+(p+1);}
function showUI(w){$('placeUI').classList.toggle('hidden',w!=='place');$('gameUI').classList.toggle('hidden',w!=='game');}
function passTo(text,cb){$('passTxt').textContent=text;$('pass').classList.remove('hidden');passCb=cb;}
$('passBtn').onclick=()=>{$('pass').classList.add('hidden');const f=passCb;passCb=null;if(f)f();};
function cellsOf(hor,a,L){const r=a/N|0,c=a%N;return [...Array(L)].map((_,k)=>hor?r*N+c+k:(r+k)*N+c);}
function clampAnchor(hor,a,L){let r=a/N|0,c=a%N;if(hor)c=Math.min(c,N-L);else r=Math.min(r,N-L);return r*N+c;}
function placeFleetRandom(){
  const g=new Array(100).fill(0),ships=[];
  for(let si=0;si<FLEET.length;si++){
    const L=FLEET[si];let ok=false;
    for(let t=0;t<300&&!ok;t++){
      const hor=Math.random()<.5,r=Math.floor(Math.random()*(hor?N:N-L+1)),c=Math.floor(Math.random()*(hor?N-L+1:N));
      const cells=cellsOf(hor,r*N+c,L);
      if(cells.every(i=>!g[i])){cells.forEach(i=>g[i]=si+1);ships.push({hor,cells});ok=true;}
    }
    if(!ok)return placeFleetRandom();
  }
  return {g,ships};
}
function newGame(){over=false;busy=false;aiQ=[];boards=[];startPlace(0);}
function startPlace(p){
  pIdx=p;
  pl={g:new Array(100).fill(0),sh:FLEET.map((L,si)=>({name:NAMES[si],len:L,cells:null,hor:true}))};
  showUI('place');
  $('pTitle').textContent='Hráč '+(p+1)+': rozmísti své lodě';
  msg('Přetáhni loď na mřížku. Klepnutím ji otočíš.');
  renderPlace();
}
function placedAll(){return pl.sh.every(s=>s.cells);}
function renderPlace(){
  const grid=$('pgrid');grid.innerHTML='';
  for(let i=0;i<100;i++){
    const d=document.createElement('div');d.className='c'+(pl.g[i]?' ship':'');d.dataset.i=i;
    d.onclick=()=>{if(pl.g[i])rotate(pl.g[i]-1);};
    grid.appendChild(d);
  }
  const tray=$('tray');tray.innerHTML='';
  pl.sh.forEach((s,si)=>{
    if(s.cells)return;
    const chip=document.createElement('div');chip.className='chip'+(s.hor?'':' v');
    for(let k=0;k<s.len;k++)chip.appendChild(document.createElement('i'));
    chip.onpointerdown=e=>{e.preventDefault();drag={si,x0:e.clientX,y0:e.clientY,moved:false};chip.setPointerCapture(e.pointerId);};
    chip.onpointermove=e=>{
      if(!drag||drag.si!==si)return;
      if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8){drag.moved=true;makeGhost(si);}
      if(drag.moved&&ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';}
    };
    chip.onpointerup=e=>endDrag(e);
    chip.onpointercancel=()=>{drag=null;removeGhost();};
    tray.appendChild(chip);
  });
  $('doneBtn').disabled=!placedAll();
}
function makeGhost(si){
  removeGhost();
  const s=pl.sh[si];ghost=document.createElement('div');ghost.className='ghost'+(s.hor?'':' v');
  for(let k=0;k<s.len;k++)ghost.appendChild(document.createElement('i'));
  document.body.appendChild(ghost);
}
function removeGhost(){if(ghost){ghost.remove();ghost=null;}}
function endDrag(e){
  if(!drag)return;
  const d=drag;drag=null;removeGhost();
  if(!d.moved){pl.sh[d.si].hor=!pl.sh[d.si].hor;renderPlace();return;}
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const cell=el&&el.closest?el.closest('#pgrid .c'):null;
  if(cell)tryPlace(d.si,+cell.dataset.i);else msg('Loď musí být na mřížce.');
  renderPlace();
}
function tryPlace(si,i){
  const s=pl.sh[si];
  const cells=cellsOf(s.hor,clampAnchor(s.hor,i,s.len),s.len);
  if(!cells.every(j=>!pl.g[j]||pl.g[j]===si+1)){msg('Tady se loď nevejde, překáží jiná.');return false;}
  cells.forEach(j=>pl.g[j]=si+1);s.cells=cells;msg('Loď umístěna.');return true;
}
function rotate(si){
  const s=pl.sh[si];const hor=!s.hor;
  const cells=cellsOf(hor,clampAnchor(hor,s.cells[0],s.len),s.len);
  if(!cells.every(j=>!pl.g[j]||pl.g[j]===si+1)){msg('Tady se loď neotočí.');return;}
  s.cells.forEach(j=>pl.g[j]=0);cells.forEach(j=>pl.g[j]=si+1);
  s.cells=cells;s.hor=hor;renderPlace();
}
$('clrBtn').onclick=()=>{pl.g.fill(0);pl.sh.forEach(s=>s.cells=null);renderPlace();msg('Lodě vymazány.');};
$('randBtn').onclick=()=>{
  const f=placeFleetRandom();pl.g=f.g;
  f.ships.forEach((s,si)=>{pl.sh[si].cells=s.cells;pl.sh[si].hor=s.hor;});
  renderPlace();msg('Náhodné rozmístění.');
};
$('doneBtn').onclick=()=>{
  if(!placedAll())return;
  boards[pIdx]={g:pl.g.slice(),ships:pl.sh.map(s=>({name:s.name,cells:s.cells.slice(),hit:0})),hits:new Array(100).fill(0)};
  if(mode==='ai'){boards[1]=placeFleetRandom();boards[1]={g:boards[1].g,ships:boards[1].ships.map((s,si)=>({name:NAMES[si],cells:s.cells,hit:0})),hits:new Array(100).fill(0)};beginPlaying();return;}
  if(pIdx===0)passTo('Předej telefon hráči 2. Nekoukej na jeho lodě!',()=>startPlace(1));
  else passTo('Hra začíná! Předej telefon hráči 1.',beginPlaying);
};
function beginPlaying(){
  turn=0;over=false;busy=false;aiQ=[];
  showUI('game');render();msg('Na tahu: '+who(0));
}
function shoot(bi,i){
  const b=boards[bi];if(b.hits[i])return null;
  if(b.g[i]){b.hits[i]=2;const s=b.ships[b.g[i]-1];s.hit++;return {hit:true,sunk:s.hit===s.cells.length?s:null};}
  b.hits[i]=1;return {hit:false,sunk:null};
}
function allSunk(b){return b.ships.every(s=>s.hit===s.cells.length);}
function fire(i){
  if(over||busy||!$('pass').classList.contains('hidden'))return;
  if(mode==='ai'&&turn===1)return;
  const bi=1-turn,r=shoot(bi,i);if(!r)return;
  afterShot(r,turn);
}
function afterShot(r,shooter){
  if(r.sunk){msg('Potopena: '+r.sunk.name+'!');beep(220,.3,.14,'square');vib(60);}
  else if(r.hit){msg('Zásah!');beep(520,.12);vib(20);}
  else{msg('Mimo…');beep(180,.1,.08,'sine');}
  render();
  if(allSunk(boards[1-shooter])){
    over=true;
    msg(mode==='ai'?(shooter===0?'Vyhrál jsi! 🏆':'Počítač vyhrál'):'Vyhrál '+who(shooter)+' 🏆');
    beep(660,.2,.12);render();return;
  }
  busy=true;
  setTimeout(()=>{
    busy=false;turn=1-turn;
    if(mode==='pvp'){passTo('Předej telefon: na tahu '+who(turn),()=>{render();msg('Na tahu: '+who(turn));});render();}
    else{render();msg('Na tahu: '+who(turn));if(turn===1)setTimeout(aiTurn,700);}
  },r.hit?900:700);
}
function neighbours(i){
  const r=i/N|0,c=i%N,out=[];
  if(r>0)out.push(i-N);if(r<N-1)out.push(i+N);if(c>0)out.push(i-1);if(c<N-1)out.push(i+1);
  return out;
}
function aiPick(){
  const b=boards[0];
  while(aiQ.length){const i=aiQ.shift();if(!b.hits[i])return i;}
  const free=[];for(let i=0;i<100;i++)if(!b.hits[i])free.push(i);
  const par=free.filter(i=>((i/N|0)+i%N)%2===0);
  const pool=par.length?par:free;
  return pool[Math.floor(Math.random()*pool.length)];
}
function aiTurn(){
  if(over||turn!==1)return;
  const i=aiPick();const r=shoot(0,i);if(!r)return;
  if(r.sunk)aiQ=[];
  else if(r.hit)neighbours(i).forEach(n=>{if(!boards[0].hits[n]&&!aiQ.includes(n))aiQ.push(n);});
  afterShot(r,1);
}
function drawGrid(el,b,target){
  el.innerHTML='';
  for(let i=0;i<100;i++){
    const h=b.hits[i];let cls='',d;
    if(target){
      if(h===1)cls='m';
      else if(h===2){const s=b.ships[b.g[i]-1];cls=s.hit===s.cells.length?'s':'h';}
      const clickable=!h&&!over&&!busy&&$('pass').classList.contains('hidden')&&!(mode==='ai'&&turn===1);
      d=document.createElement(clickable?'button':'div');
      if(clickable){cls+=' ok';d.onclick=()=>fire(i);}
    }else{
      if(b.g[i])cls='ship';
      if(h===1)cls='m';
      else if(h===2){const s=b.ships[b.g[i]-1];cls=s.hit===s.cells.length?'s':'h';}
      d=document.createElement('div');
    }
    d.className='c '+cls;el.appendChild(d);
  }
}
function render(){
  drawGrid($('target'),boards[1-turn],true);
  drawGrid($('own'),boards[turn],false);
  $('tTitle').textContent='Cíl: střílí '+who(turn);
  $('ownTitle').textContent='Flotila: '+who(turn);
}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));newGame();
});
$('newBtn').onclick=newGame;
newGame();

})();
</script>
</body>
</html>
