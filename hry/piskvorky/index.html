<!DOCTYPE html>
<!-- herna-ok -->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef4ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vesmírná střílečka">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="ikona.svg">
<title>Piškvorky</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;color:#3a3350;background:linear-gradient(180deg,#eef4ff,#fdeef5);
  display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));overflow:hidden}
button{font:inherit;cursor:pointer;border:0}
.top{width:100%;max-width:520px;display:flex;align-items:center;gap:8px}
.round{width:42px;height:42px;border-radius:50%;background:#fff;color:#5b5275;font-size:18px;font-weight:800;box-shadow:0 4px 12px -6px rgba(60,40,100,.5);flex:none}
h1{flex:1;margin:0;text-align:center;font-size:22px;font-weight:800;color:#2f2843}
.mode{display:flex;gap:4px;background:#fff;padding:4px;border-radius:14px;margin:10px 0 8px;box-shadow:0 4px 12px -8px rgba(60,40,100,.5)}
.mode button{padding:8px 14px;border-radius:10px;background:transparent;color:#7d7594;font-weight:700;font-size:14px}
.mode button.on{background:#4d96ff;color:#fff}
.score{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;margin-bottom:8px}
.pl{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:#fff;opacity:.55;transition:.2s}
.pl.on{opacity:1;box-shadow:0 0 0 3px var(--c),0 6px 14px -8px var(--c);transform:scale(1.05)}
.pl b{font-size:20px;color:var(--c)}
#msg{height:24px;font-size:16px;font-weight:700;color:#5b5275;margin-bottom:6px;text-align:center}
#board{display:grid;background:#fff;border-radius:16px;padding:6px;gap:2px;box-shadow:0 10px 24px -14px rgba(60,40,100,.55)}
.c{background:#f3f6fd;border-radius:6px;display:grid;place-items:center;font-weight:900;line-height:1;padding:0}
.c.x{color:#4d96ff;font-size:1.25em}.c.o{color:#ff5c93}
.c.last{background:#fff3c4}
.c.win{background:#c9f2d6;animation:pop .5s ease}
.c.new{animation:pop .2s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.bottom{display:flex;gap:10px;margin-top:12px}
.act{padding:11px 18px;border-radius:14px;background:#fff;color:#5b5275;font-weight:800;font-size:15px;box-shadow:0 6px 14px -10px rgba(60,40,100,.6)}
.act.main{background:#4d96ff;color:#fff}
</style>
</head>
<body>
<div class="top">
  <button class="round" id="homeBtn" aria-label="Herna">⌂</button>
  <h1>Piškvorky</h1>
  <div style="width:42px"></div>
</div>
<div class="mode" id="mode"><button data-m="2" class="on">👥 Dva hráči</button><button data-m="ai">🤖 Počítač</button></div>
<div class="score">
  <div class="pl" id="plX" style="--c:#4d96ff"><b>✕</b><span id="nX">Hráč 1</span> <span id="sX">0</span></div>
  <div class="pl" id="plO" style="--c:#ff5c93"><b>◯</b><span id="nO">Hráč 2</span> <span id="sO">0</span></div>
</div>
<div id="msg"></div>
<div id="board"></div>
<div class="bottom">
  <button class="act" id="undoBtn">↶ Zpět tah</button>
  <button class="act main" id="newBtn">↻ Nová hra</button>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const COLS = 10, ROWS = 12, WIN = 5;
let board, moves, turn, over, vsAI = false, starter = 'x', score = { x: 0, o: 0 }, cells = [];
const AI = 'o';

function layout(){
  const avW = Math.min(innerWidth - 20, 520) - 12;
  const avH = innerHeight - $('board').getBoundingClientRect().top - 90;
  const s = Math.max(22, Math.floor(Math.min(avW / COLS, avH / ROWS)) - 2);
  $('board').style.gridTemplateColumns = `repeat(${COLS}, ${s}px)`;
  $('board').style.gridAutoRows = s + 'px';
  $('board').style.fontSize = Math.round(s * 0.62) + 'px';
}
function build(){
  $('board').innerHTML = ''; cells = [];
  for (let i = 0; i < COLS * ROWS; i++) {
    const b = document.createElement('button'); b.className = 'c'; b.dataset.i = i;
    $('board').appendChild(b); cells.push(b);
  }
}
function newGame(){
  board = new Array(COLS * ROWS).fill(''); moves = []; over = false; turn = starter;
  cells.forEach(c => { c.className = 'c'; c.textContent = ''; });
  update();
  if (vsAI && turn === AI) setTimeout(aiMove, 400);
}
function name(p){ return vsAI ? (p === AI ? 'Počítač' : 'Ty') : (p === 'x' ? 'Hráč 1' : 'Hráč 2'); }
function update(){
  $('nX').textContent = name('x'); $('nO').textContent = name('o');
  $('sX').textContent = score.x; $('sO').textContent = score.o;
  $('plX').classList.toggle('on', !over && turn === 'x'); $('plO').classList.toggle('on', !over && turn === 'o');
  if (!over) $('msg').textContent = vsAI ? (turn === AI ? 'Počítač přemýšlí…' : 'Jsi na tahu') : 'Na tahu: ' + (turn === 'x' ? '✕ ' : '◯ ') + name(turn);
  $('undoBtn').disabled = !moves.length; $('undoBtn').style.opacity = moves.length ? 1 : .5;
}
function line(i, p){
  const r = i / COLS | 0, c = i % COLS;
  for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    const L = [i];
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[rr * COLS + cc] === p) { L.push(rr * COLS + cc); rr += dr * s; cc += dc * s; }
    }
    if (L.length >= WIN) return L;
  }
  return null;
}
let AC = null;
function beep(f, d, v = 0.12){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); } catch (_) {} }
function place(i){
  if (over || board[i]) return;
  board[i] = turn; moves.push(i);
  cells.forEach(c => c.classList.remove('last'));
  const c = cells[i]; c.textContent = turn === 'x' ? '✕' : '◯'; c.classList.add(turn, 'last', 'new');
  setTimeout(() => c.classList.remove('new'), 220);
  beep(turn === 'x' ? 520 : 400, 0.08);
  const w = line(i, turn);
  if (w) {
    over = true; score[turn]++;
    w.forEach(k => cells[k].classList.add('win'));
    $('msg').textContent = vsAI ? (turn === AI ? 'Počítač vyhrál 🤖' : 'Vyhrál jsi! 🎉') : name(turn) + ' vyhrál! 🎉';
    beep(523, .15, .15); setTimeout(() => beep(659, .15, .15), 140); setTimeout(() => beep(784, .3, .15), 280);
    try { navigator.vibrate && navigator.vibrate(100); } catch (_) {}
    starter = starter === 'x' ? 'o' : 'x';
  } else if (moves.length === board.length) {
    over = true; $('msg').textContent = 'Remíza 🤝'; starter = starter === 'x' ? 'o' : 'x';
  } else turn = turn === 'x' ? 'o' : 'x';
  update();
  if (!over && vsAI && turn === AI) setTimeout(aiMove, 350);
}
// ---------- počítač ----------
function val(n, open){
  if (n >= 5) return 1e7;
  if (open === 0) return 0;
  return [0, [2, 10], [40, 220], [600, 6000], [12000, 120000]][n][open - 1];
}
function evalCell(i, p){
  const r = i / COLS | 0, c = i % COLS; let total = 0;
  for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    let n = 1, open = 0;
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[rr * COLS + cc] === p) { n++; rr += dr * s; cc += dc * s; }
      if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[rr * COLS + cc] === '') open++;
    }
    total += val(n, open);
  }
  return total;
}
function aiMove(){
  if (over || turn !== AI) return;
  const me = AI, op = AI === 'x' ? 'o' : 'x';
  if (!moves.length) { place((ROWS / 2 | 0) * COLS + (COLS / 2 | 0)); return; }
  let best = -1, bi = -1;
  for (let i = 0; i < board.length; i++) {
    if (board[i]) continue;
    const r = i / COLS | 0, c = i % COLS; let near = false;
    for (let dr = -2; dr <= 2 && !near; dr++) for (let dc = -2; dc <= 2; dc++) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[rr * COLS + cc]) { near = true; break; }
    }
    if (!near) continue;
    const s = evalCell(i, me) * 1.1 + evalCell(i, op) + Math.random() * 5;
    if (s > best) { best = s; bi = i; }
  }
  place(bi);
}
// ---------- ovládání ----------
$('board').addEventListener('click', e => {
  const b = e.target.closest('.c'); if (!b) return;
  if (vsAI && turn === AI) return;
  place(+b.dataset.i);
});
$('undoBtn').onclick = () => {
  if (!moves.length) return;
  if (over) { const li = moves[moves.length - 1], p = board[li]; if (line(li, p)) { score[p]--; starter = starter === 'x' ? 'o' : 'x'; } over = false; }
  const pop = () => { const i = moves.pop(), p = board[i]; board[i] = ''; cells[i].textContent = ''; cells[i].className = 'c'; turn = p; return p; };
  if (vsAI) { while (moves.length) { if (pop() !== AI) break; } }
  else pop();
  cells.forEach(c => c.classList.remove('win', 'last'));
  if (moves.length) cells[moves[moves.length - 1]].classList.add('last');
  update();
  if (vsAI && turn === AI) setTimeout(aiMove, 350);
};
$('newBtn').onclick = newGame;
$('mode').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  vsAI = b.dataset.m === 'ai';
  [...$('mode').children].forEach(x => x.classList.toggle('on', x === b));
  score = { x: 0, o: 0 }; starter = 'x'; newGame();
};
$('homeBtn').onclick = () => { location.href = '../../index.html'; };
addEventListener('resize', layout);
build(); layout(); newGame();
try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('../../sw.js', { updateViaCache: 'none' }).catch(() => {}); } catch (_) {}
})();
</script>
</body>
</html>
