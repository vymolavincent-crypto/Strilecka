<!DOCTYPE html>
<!-- herna-ok -->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vesmírná střílečka">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="ikona.png">
<title>Piškvorky</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
body{font-family:ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,"Courier New",monospace;color:#dfe6ff;background:#0b0d26;
  display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
canvas,img{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;cursor:pointer;border:0}
.top{width:100%;max-width:520px;display:flex;align-items:center;gap:8px}
.round{width:38px;height:38px;background:#151a44;color:#dfe6ff;font-size:16px;font-weight:900;box-shadow:0 0 0 3px #2c3778;flex:none;margin:3px}
h1{flex:1;margin:0;text-align:center;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);text-shadow:3px 3px 0 #05061a}
.mode{display:flex;gap:6px;margin:12px 0 10px}
.mode button{padding:8px 12px;background:#151a44;color:#8fa0d8;font-weight:800;font-size:12.5px;box-shadow:0 0 0 3px #2c3778;text-transform:uppercase}
.mode button.on{background:var(--acc);color:#0b0d26;box-shadow:0 0 0 3px var(--acc)}
.score{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.pl{display:flex;align-items:center;gap:7px;padding:6px 10px;background:#151a44;opacity:.5;box-shadow:0 0 0 3px #2c3778;margin:3px}
.pl.on{opacity:1;box-shadow:0 0 0 3px var(--c);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{box-shadow:0 0 0 3px #2c3778}}
.pl i{display:inline-block;width:18px;height:18px;background-size:100% 100%;image-rendering:pixelated}
#msg{height:24px;font-size:14px;font-weight:800;color:#ffd166;margin-bottom:8px;text-align:center;text-transform:uppercase;letter-spacing:1px}
.bottom{display:flex;gap:12px;margin-top:16px}
.act{padding:11px 14px;background:#151a44;color:#dfe6ff;font-weight:900;font-size:13px;text-transform:uppercase;box-shadow:0 0 0 3px #2c3778;margin:3px}
.act:active,.mode button:active{transform:translate(2px,2px)}
.act.main{background:var(--acc);color:#0b0d26;box-shadow:0 0 0 3px var(--acc),inset 0 -4px 0 0 rgba(0,0,0,.25)}
:root{--acc:#5ee7ff}
#board{display:grid;background:#2c3778;padding:4px;gap:2px;box-shadow:0 0 0 4px #5ee7ff,0 0 0 8px #0b0d26,8px 8px 0 4px #05061a}
.c{background:#111640;display:block;padding:0;font-size:0!important;color:transparent;background-size:78% 78%;background-position:center;background-repeat:no-repeat;image-rendering:pixelated}
.c:active{background-color:#1a2160}
.c.x{background-image:var(--sx)}.c.o{background-image:var(--so)}
.c.last{background-color:#3a3418}
.c.win{background-color:#1f6b45;animation:pop .5s steps(4)}
.c.new{animation:pop .2s steps(3)}
@keyframes pop{0%{background-size:30% 30%}60%{background-size:95% 95%}100%{background-size:78% 78%}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="top">
  <button class="round" id="homeBtn" aria-label="Menu">⌂</button>
  <h1>Piškvorky</h1>
  <div style="width:42px"></div>
</div>
<div class="mode" id="mode"><button data-m="2" class="on">👥 Dva hráči</button><button data-m="ai">🤖 Počítač</button></div>
<div class="score">
  <div class="pl" id="plX" style="--c:#5ee7ff"><i style="background-image:var(--sx)"></i><span id="nX">Hráč 1</span> <span id="sX">0</span></div>
  <div class="pl" id="plO" style="--c:#ff6bd6"><i style="background-image:var(--so)"></i><span id="nO">Hráč 2</span> <span id="sO">0</span></div>
</div>
<div id="msg"></div>
<div id="board"></div>
<div class="bottom">
  <button class="act" id="undoBtn">↶ Zpět tah</button>
  <button class="act main" id="newBtn">↻ Nová hra</button>
</div>

<script>
(() => {
// ---------- pixelové obrázky a vesmírné pozadí ----------
(function pixelArt(){
  const mk = (rows, pal) => { const h = rows.length, w = rows[0].length, c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } })); return 'url(' + c.toDataURL() + ')'; };
  const X = ["aa.....aa","abb...bba",".abb.bba.","..abbba..","...bbb...","..abbba..",".abb.bba.","abb...bba","aa.....aa"];
  const O = ["..aaaaa..",".abbbbba.","abb...bba","ab.....ba","ab.....ba","ab.....ba","abb...bba",".abbbbba.","..aaaaa.."];
  const D = ["...aaaa...",".aabbbbaa.",".abwbbbbba","abwbbbbbba","abbbbbbbba","abbbbbbbca","abbbbbbbca",".abbbbcca.",".aaccccaa.","...aaaa..."];
  const HO = ["...aaaa...",".aabbbbaa.",".abbbbbbb.","abbbbbbbbb","abbbbbbbbb","abbbbbbbbb","abbbbbbbbb",".bbbbbbbb.","..bbbbbb..","...bbbb..."];
  const r = document.documentElement.style;
  r.setProperty('--sx', mk(X, { a:'#2a6fd6', b:'#5ee7ff' }));
  r.setProperty('--so', mk(O, { a:'#b8379a', b:'#ff6bd6' }));
  r.setProperty('--dr', mk(D, { a:'#7a1f33', b:'#ff6b6b', c:'#c23b4a', w:'#ffd0d0' }));
  r.setProperty('--dy', mk(D, { a:'#7a5a10', b:'#ffd166', c:'#d9a020', w:'#fff6d0' }));
  r.setProperty('--dw', mk(D, { a:'#ffffff', b:'#ffffff', c:'#dfe6ff', w:'#ffffff' }));
  r.setProperty('--hole', mk(HO, { a:'#05061a', b:'#0b0d26' }));
  const bg = document.getElementById('bg'); if (!bg) return; const bc = bg.getContext('2d'); let st = [];
  const size = () => { bg.width = Math.ceil(innerWidth / 3); bg.height = Math.ceil(innerHeight / 3); st = Array.from({ length: 70 }, () => ({ x: Math.random() * bg.width, y: Math.random() * bg.height, v: .02 + Math.random() * .08, c: Math.random() < .15 ? '#ffffff' : Math.random() < .5 ? '#5f6cb8' : '#2c3570' })); };
  const frame = () => { bc.fillStyle = '#0b0d26'; bc.fillRect(0, 0, bg.width, bg.height); for (const s of st) { s.y += s.v; if (s.y > bg.height) { s.y = 0; s.x = Math.random() * bg.width; } bc.fillStyle = s.c; bc.fillRect(s.x | 0, s.y | 0, 1, 1); } requestAnimationFrame(frame); };
  addEventListener('resize', size); size(); frame();
})();

const $ = id => document.getElementById(id);
const COLS = 10, ROWS = 12, WIN = 5;
let board, moves, turn, over, vsAI = false, starter = 'x', score = { x: 0, o: 0 }, cells = [];
const AI = 'o';

function layout(){
  const avW = Math.min(innerWidth - 20, 520) - 12;
  const avH = innerHeight - $('board').getBoundingClientRect().top - 90;
  const s = Math.max(22, Math.floor(Math.min(avW / COLS, avH / ROWS)) - 2);
  $('board').style.gridTemplateColumns = `repeat(${COLS}, ${s}px)`;
  $('board').style.gridAutoRows = s + 'px';
  $('board').style.fontSize = Math.round(s * 0.62) + 'px';
}
function build(){
  $('board').innerHTML = ''; cells = [];
  for (let i = 0; i < COLS * ROWS; i++) {
    const b = document.createElement('button'); b.className = 'c'; b.dataset.i = i;
    $('board').appendChild(b); cells.push(b);
  }
}
function newGame(){
  board = new Array(COLS * ROWS).fill(''); moves = []; over = false; turn = starter;
  cells.forEach(c => { c.className = 'c'; c.textContent = ''; });
  update();
  if (vsAI && turn === AI) setTimeout(aiMove, 400);
}
function name(p){ return vsAI ? (p === AI ? 'Počítač' : 'Ty') : (p === 'x' ? 'Hráč 1' : 'Hráč 2'); }
function update(){
  $('nX').textContent = name('x'); $('nO').textContent = name('o');
  $('sX').textContent = score.x; $('sO').textContent = score.o;
  $('plX').classList.toggle('on', !over && turn === 'x'); $('plO').classList.toggle('on', !over && turn === 'o');
  if (!over) $('msg').textContent = vsAI ? (turn === AI ? 'Počítač přemýšlí…' : 'Jsi na tahu') : 'Na tahu: ' + (turn === 'x' ? '✕ ' : '◯ ') + name(turn);
  $('undoBtn').disabled = !moves.length; $('undoBtn').style.opacity = moves.length ? 1 : .5;
}
function line(i, p){
  const r = i / COLS | 0, c = i % COLS;
  for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    const L = [i];
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[rr * COLS + cc] === p) { L.push(rr * COLS + cc); rr += dr * s; cc += dc * s; }
    }
    if (L.length >= WIN) return L;
  }
  return null;
}
let AC = null;
function beep(f, d, v = 0.12){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); } catch (_) {} }
function place(i){
  if (over || board[i]) return;
  board[i] = turn; moves.push(i);
  cells.forEach(c => c.classList.remove('last'));
  const c = cells[i]; c.textContent = turn === 'x' ? '✕' : '◯'; c.classList.add(turn, 'last', 'new');
  setTimeout(() => c.classList.remove('new'), 220);
  beep(turn === 'x' ? 520 : 400, 0.08);
  const w = line(i, turn);
  if (w) {
    over = true; score[turn]++;
    w.forEach(k => cells[k].classList.add('win'));
    $('msg').textContent = vsAI ? (turn === AI ? 'Počítač vyhrál 🤖' : 'Vyhrál jsi! 🎉') : name(turn) + ' vyhrál! 🎉';
    beep(523, .15, .15); setTimeout(() => beep(659, .15, .15), 140); setTimeout(() => beep(784, .3, .15), 280);
    try { navigator.vibrate && navigator.vibrate(100); } catch (_) {}
    starter = starter === 'x' ? 'o' : 'x';
  } else if (moves.length === board.length) {
    over = true; $('msg').textContent = 'Remíza 🤝'; starter = starter === 'x' ? 'o' : 'x';
  } else turn = turn === 'x' ? 'o' : 'x';
  update();
  if (!over && vsAI && turn === AI) setTimeout(aiMove, 350);
}
// ---------- počítač ----------
function val(n, open){
  if (n >= 5) return 1e7;
  if (open === 0) return 0;
  return [0, [2, 10], [40, 220], [600, 6000], [12000, 120000]][n][open - 1];
}
function evalCell(i, p){
  const r = i / COLS | 0, c = i % COLS; let total = 0;
  for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    let n = 1, open = 0;
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[rr * COLS + cc] === p) { n++; rr += dr * s; cc += dc * s; }
      if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[rr * COLS + cc] === '') open++;
    }
    total += val(n, open);
  }
  return total;
}
function aiMove(){
  if (over || turn !== AI) return;
  const me = AI, op = AI === 'x' ? 'o' : 'x';
  if (!moves.length) { place((ROWS / 2 | 0) * COLS + (COLS / 2 | 0)); return; }
  let best = -1, bi = -1;
  for (let i = 0; i < board.length; i++) {
    if (board[i]) continue;
    const r = i / COLS | 0, c = i % COLS; let near = false;
    for (let dr = -2; dr <= 2 && !near; dr++) for (let dc = -2; dc <= 2; dc++) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[rr * COLS + cc]) { near = true; break; }
    }
    if (!near) continue;
    const s = evalCell(i, me) * 1.1 + evalCell(i, op) + Math.random() * 5;
    if (s > best) { best = s; bi = i; }
  }
  place(bi);
}
// ---------- ovládání ----------
$('board').addEventListener('click', e => {
  const b = e.target.closest('.c'); if (!b) return;
  if (vsAI && turn === AI) return;
  place(+b.dataset.i);
});
$('undoBtn').onclick = () => {
  if (!moves.length) return;
  if (over) { const li = moves[moves.length - 1], p = board[li]; if (line(li, p)) { score[p]--; starter = starter === 'x' ? 'o' : 'x'; } over = false; }
  const pop = () => { const i = moves.pop(), p = board[i]; board[i] = ''; cells[i].textContent = ''; cells[i].className = 'c'; turn = p; return p; };
  if (vsAI) { while (moves.length) { if (pop() !== AI) break; } }
  else pop();
  cells.forEach(c => c.classList.remove('win', 'last'));
  if (moves.length) cells[moves[moves.length - 1]].classList.add('last');
  update();
  if (vsAI && turn === AI) setTimeout(aiMove, 350);
};
$('newBtn').onclick = newGame;
$('mode').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  vsAI = b.dataset.m === 'ai';
  [...$('mode').children].forEach(x => x.classList.toggle('on', x === b));
  score = { x: 0, o: 0 }; starter = 'x'; newGame();
};
$('homeBtn').onclick = () => { location.href = '../../index.html'; };
addEventListener('resize', layout);
build(); layout(); newGame();
try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('../../sw.js', { updateViaCache: 'none' }).catch(() => {}); } catch (_) {}
})();
</script>
<!-- xmas-snow -->
<canvas id="xmasSnow" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40"></canvas>
<script>
(function(){
var c=document.getElementById('xmasSnow'),g=c.getContext('2d'),F=[],T=0;
var COL=['#e0262f','#2fb35a','#ffd24a','#ffffff'];
function size(){c.width=Math.ceil(innerWidth/3);c.height=Math.ceil(innerHeight/3);F=[];for(var i=0;i<70;i++)F.push({x:Math.random()*c.width,y:Math.random()*c.height,v:.14+Math.random()*.3,s:Math.random()*6});}
function frame(){T++;g.clearRect(0,0,c.width,c.height);
g.fillStyle='#1f7a3d';g.fillRect(0,0,c.width,1);
for(var x=0;x<c.width;x+=4){g.fillStyle=COL[((x/4)+T/30|0)%3];g.fillRect(x,1,2,2);}
g.fillStyle='#ffffff';
for(var i=0;i<F.length;i++){var f=F[i];f.y+=f.v;f.x+=Math.sin(f.y*.2+f.s)*.15;if(f.y>c.height){f.y=-2;f.x=Math.random()*c.width;}g.fillRect(f.x|0,f.y|0,1,1);}
requestAnimationFrame(frame);}
addEventListener('resize',size);size();frame();
})();
</script>
</body>
</html>
