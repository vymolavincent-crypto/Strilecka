<!DOCTYPE html>
<!-- herna-ok -->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vesmírná střílečka">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="ikona.png">
<title>Závod raket</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
:root{--acc:#5ee7ff}
body{font-family:ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,"Courier New",monospace;color:#dfe6ff;background:#0b0d26;display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.top{width:100%;max-width:520px;display:flex;align-items:center;gap:8px}
.round{width:38px;height:38px;background:#151a44;color:#dfe6ff;font-size:16px;font-weight:900;box-shadow:0 0 0 3px #2c3778;flex:none;margin:3px}
h1{flex:1;margin:0;text-align:center;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);text-shadow:3px 3px 0 #05061a}
.mode{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap;justify-content:center}
.mode button,.act{padding:9px 12px;background:#151a44;color:#dfe6ff;font-weight:900;font-size:12.5px;text-transform:uppercase;box-shadow:0 0 0 3px #2c3778;margin:3px}
.mode button.on,.act.main{background:var(--acc);color:#0b0d26;box-shadow:0 0 0 3px var(--acc),inset 0 -4px 0 0 rgba(0,0,0,.25)}
.act:disabled{opacity:.45}
.act:active,.mode button:active,.round:active{transform:translate(2px,2px)}
#msg{min-height:24px;font-size:14px;font-weight:800;color:#ffd166;margin:6px 0;text-align:center;text-transform:uppercase;letter-spacing:1px}
.bottom{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.label{font-size:12px;font-weight:800;text-transform:uppercase;color:#8fa0d8;margin:8px 0 4px;letter-spacing:1px}
.hidden{display:none!important}

body{height:100vh;height:100dvh;overflow:hidden;padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.grid3{width:100%;max-width:520px;display:grid;grid-template-columns:92px 1fr 92px;align-items:center;gap:6px}
.corner{width:92px;height:92px;padding:0;background:#151a44 var(--img) center/68% no-repeat;image-rendering:pixelated;box-shadow:0 0 0 4px var(--c),0 6px 0 4px #05061a}
.corner:active{transform:translateY(3px);box-shadow:0 0 0 4px var(--c),0 3px 0 4px #05061a}
.corner.off{visibility:hidden}
.ctr{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#msg{min-height:20px;font-size:13px;font-weight:800;color:#ffd166;text-transform:uppercase;letter-spacing:1px}
#lanes{width:100%;max-width:520px;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px;margin:6px 0}
.lane{display:flex;flex-direction:column;gap:6px;background:#151a44;box-shadow:0 0 0 3px #2c3778;padding:8px}
.name{font-size:12px;font-weight:900;text-transform:uppercase;color:var(--c);letter-spacing:1px}
.track{position:relative;height:40px;background:repeating-linear-gradient(90deg,#1d2565 0 12px,#151a44 12px 24px);box-shadow:inset 0 0 0 3px #2c3778}
.fin{position:absolute;right:2px;top:3px;bottom:3px;width:16px;background:repeating-conic-gradient(#ffffff 0 25%,#05061a 0 50%) 0 0/8px 8px}
.rk{position:absolute;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;background-size:100% 100%;image-rendering:pixelated;transform:rotate(90deg);transition:left .12s steps(2)}
.rk.boost,.corner.boost{filter:brightness(1.7)}
#go{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;color:#ffd166;text-shadow:4px 4px 0 #05061a;pointer-events:none;z-index:4}
</style>
<style id="xmas-theme">body{background:#0a2418!important}.act.main,.mode button.on{background:#e0262f!important;color:#fff!important;box-shadow:0 0 0 3px #2fb35a,inset 0 -4px 0 rgba(0,0,0,.25)!important}.act:not(.main){box-shadow:0 0 0 3px #1f7a3d!important}</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="top"><button class="round" id="homeBtn" aria-label="Menu">⌂</button><h1>Závod raket</h1><div style="width:42px"></div></div>

<div class="grid3">
  <button class="corner" id="k0"></button>
  <div class="ctr"><button class="round" id="homeBtn" aria-label="Menu">⌂</button><div id="msg"></div></div>
  <button class="corner" id="k2"></button>
</div>
<div id="lanes"></div>
<div class="grid3">
  <button class="corner" id="k3"></button>
  <div class="ctr"><div class="mode" id="mode"><button data-n="2" class="on">2 hráči</button><button data-n="3">3</button><button data-n="4">4</button></div><button class="act main" id="againBtn">↻ Znovu</button></div>
  <button class="corner" id="k1"></button>
</div>
<div id="go"></div>

<script>
(() => {
const bg=document.getElementById('bg'),bc=bg.getContext('2d');let st=[];
const size=()=>{bg.width=Math.ceil(innerWidth/3);bg.height=Math.ceil(innerHeight/3);st=Array.from({length:70},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,v:.02+Math.random()*.08,c:Math.random()<.15?'#ffffff':'#5f6cb8'}));};
const frame=()=>{bc.fillStyle='#0b0d26';bc.fillRect(0,0,bg.width,bg.height);for(const s of st){s.y+=s.v;if(s.y>bg.height){s.y=0;s.x=Math.random()*bg.width;}bc.fillStyle=s.c;bc.fillRect(s.x|0,s.y|0,1,1);}requestAnimationFrame(frame);};
addEventListener('resize',size);size();frame();
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
let AC=null;
function beep(f,d,v=.12,t='triangle'){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d);}catch(_){}}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(_){}}
function sprite(rows,pal){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1);}}));return 'url('+c.toDataURL()+')';}
$('homeBtn').onclick=()=>location.href='../../index.html';

const COLS=['#5ee7ff','#ff6bd6','#ffd166','#7dffa8'];
const RKrows=["...ww...","..wwww..","..wwww..","..wwww..",".rwwwwr.","rr.ww.rr","y..ww..y","...yy..."];
const CORNER=['k0','k1','k2','k3'];
const FINISH=100,STEP=1.2;
let n=2,prog=[],started=false,over=false,lanesEl=[],cornersEl=[];
function msg(t){$('msg').textContent=t;}
function build(){
  $('lanes').innerHTML='';prog=new Array(n).fill(0);lanesEl=[];cornersEl=[];
  for(let p=0;p<4;p++){
    const k=$(CORNER[p]);
    if(p>=n){k.classList.add('off');continue;}
    const col=COLS[p];
    k.classList.remove('off');
    k.style.setProperty('--c',col);
    k.style.setProperty('--img',sprite(RKrows,{w:col,r:'#ff4d6d',y:'#ffd166'}));
    k.onpointerdown=e=>{e.preventDefault();tap(p);};
    cornersEl.push(k);
    const lane=document.createElement('div');lane.className='lane';lane.style.setProperty('--c',col);
    lane.innerHTML='<div class="name">Hráč '+(p+1)+'</div><div class="track"><div class="fin"></div><div class="rk"></div></div>';
    lane.querySelector('.rk').style.backgroundImage=sprite(RKrows,{w:col,r:'#ff4d6d',y:'#ffd166'});
    $('lanes').appendChild(lane);lanesEl.push(lane.querySelector('.rk'));
  }
}
function show(p){
  const r=lanesEl[p];
  r.style.left='calc('+(prog[p]*0.92)+'% + 6px)';
  r.classList.add('boost');setTimeout(()=>r.classList.remove('boost'),120);
  const k=$(CORNER[p]);k.classList.add('boost');setTimeout(()=>k.classList.remove('boost'),120);
}
function tap(p){
  if(over)return;
  if(!started){msg('Počkej na START!');beep(160,.08,.1,'square');return;}
  prog[p]=Math.min(FINISH,prog[p]+STEP);
  show(p);beep(520+prog[p]*5,.04,.05);
  if(prog[p]>=FINISH){over=true;msg('Vyhrál Hráč '+(p+1)+'! 🏆');beep(880,.3,.14);vib(60);}
}
function countdown(){
  started=false;over=false;msg('Připravte se…');
  const go=$('go');let k=3;
  const tick=()=>{
    if(k>0){go.textContent=k;beep(440,.15,.12);k--;setTimeout(tick,800);}
    else{go.textContent='START!';beep(880,.3,.15);started=true;msg('Klepej na svou raketu!');setTimeout(()=>go.textContent='',700);}
  };
  tick();
}
function newGame(){build();countdown();}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{
  n=+b.dataset.n;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));newGame();
});
$('againBtn').onclick=newGame;
newGame();

})();
</script>
<!-- xmas-snow -->
<canvas id="xmasSnow" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40"></canvas>
<script>
(function(){
var c=document.getElementById('xmasSnow'),g=c.getContext('2d'),F=[],T=0;
var COL=['#e0262f','#2fb35a','#ffd24a','#ffffff'];
function size(){c.width=Math.ceil(innerWidth/3);c.height=Math.ceil(innerHeight/3);F=[];for(var i=0;i<70;i++)F.push({x:Math.random()*c.width,y:Math.random()*c.height,v:.14+Math.random()*.3,s:Math.random()*6});}
function frame(){T++;g.clearRect(0,0,c.width,c.height);
g.fillStyle='#1f7a3d';g.fillRect(0,0,c.width,1);
for(var x=0;x<c.width;x+=4){g.fillStyle=COL[((x/4)+T/30|0)%3];g.fillRect(x,1,2,2);}
g.fillStyle='#ffffff';
for(var i=0;i<F.length;i++){var f=F[i];f.y+=f.v;f.x+=Math.sin(f.y*.2+f.s)*.15;if(f.y>c.height){f.y=-2;f.x=Math.random()*c.width;}g.fillRect(f.x|0,f.y|0,1,1);}
requestAnimationFrame(frame);}
addEventListener('resize',size);size();frame();
})();
</script>
</body>
</html>
